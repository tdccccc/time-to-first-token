# 学习计划的网站版（MkDocs + Material 主题），部署到 GitHub Pages。
# 书籍式结构：5 部分 / 31 章；左侧可折叠目录，右侧本页笔记。
#
# Markdown 仍是唯一事实来源：改内容请改 md，推送后 Actions 自动重新生成上线。
# site-build.sh 会把 README / 模块 README 重排成 docs/chapters/ 下的章节页。
#
# 本地预览（默认 http://127.0.0.1:8010/time-to-first-token/）：
#   uv venv .venv-mkdocs
#   uv pip install --python .venv-mkdocs/bin/python -r requirements.txt
#   bash site-build.sh serve
# 没有 uv 时：python3 -m venv .venv-mkdocs && .venv-mkdocs/bin/pip install -r requirements.txt
#
# 推送到 main 后，.github/workflows/pages.yml 会自动构建并发布到 GitHub Pages。
site_name: 边做边学 LLM 推理服务
site_description: 一本写给工程师的 LLM 推理基础设施书：5 部分、31 章，从 Roofline 到跨芯片对比。
site_url: https://tdccccc.github.io/time-to-first-token/
repo_url: https://github.com/tdccccc/time-to-first-token
repo_name: tdccccc/time-to-first-token
copyright: 基于 CC BY 4.0 发布 · 上游 patchy631/time-to-first-token

docs_dir: site-src
site_dir: site

# 构建时把警告当错误：坏链接、未登记页面会直接让 CI 失败。
strict: true

theme:
  name: material
  language: zh
  custom_dir: overrides
  font: false
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/notes.js
  - assets/progress.js

plugins:
  - search:
      lang: zh

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - fenced_code
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 前言: index.md
  - 全书目录: docs/catalog.md

  - 第一部分 基础与度量:
      - 本部分导览: docs/parts/part-1.md
      - 第 1 章 Roofline：先算，再优化: docs/chapters/chapter-01.md
      - 第 2 章 推理度量：四个数，一个分布: docs/chapters/chapter-02.md
      - 第 3 章 Profiling：看时间花在哪: docs/chapters/chapter-03.md
      - 第 4 章 写压测脚本：bench_openai.py: docs/chapters/chapter-04.md
      - 第 5 章 跑出第一份基线: docs/chapters/chapter-05.md

  - 第二部分 推理框架:
      - 本部分导览: docs/parts/part-2.md
      - 第 6 章 心智模型: docs/chapters/chapter-06.md
      - 第 7 章 模型架构: docs/chapters/chapter-07.md
      - 第 8 章 vLLM：先部署，再读内部实现: docs/chapters/chapter-08.md
      - 第 9 章 度量基础设施: docs/chapters/chapter-09.md
      - 第 10 章 SGLang 与批处理内部: docs/chapters/chapter-10.md
      - 第 11 章 压测到 1000 并发: docs/chapters/chapter-11.md
      - 第 12 章 量化取舍: docs/chapters/chapter-12.md
      - 第 13 章 投机解码与 KV 淘汰: docs/chapters/chapter-13.md
      - 第 14 章 解耦式服务与 Kubernetes: docs/chapters/chapter-14.md
      - 第 15 章 大规模集群 PD 优化: docs/chapters/chapter-15.md
      - 第 16 章 单位经济学与路由器: docs/chapters/chapter-16.md
      - 第 17 章 发表与阅读习惯: docs/chapters/chapter-17.md
      - 第 18 章 TensorRT-LLM：编译式推理引擎: docs/chapters/chapter-18.md

  - 第三部分 算子优化:
      - 本部分导览: docs/parts/part-3.md
      - 第 19 章 CUDA 优化阶梯: docs/chapters/chapter-19.md
      - 第 20 章 Triton 入门: docs/chapters/chapter-20.md
      - 第 21 章 Fused Attention 深讲: docs/chapters/chapter-21.md
      - 第 22 章 量化 Matmul 深讲: docs/chapters/chapter-22.md
      - 第 23 章 FlashAttention 与 CUTLASS: docs/chapters/chapter-23.md
      - 第 24 章 接入推理引擎: docs/chapters/chapter-24.md

  - 第四部分 国产芯片适配:
      - 本部分导览: docs/parts/part-4.md
      - 第 25 章 芯片与软件栈地图: docs/chapters/chapter-25.md
      - 第 26 章 CANN 与 AscendC: docs/chapters/chapter-26.md
      - 第 27 章 Ascend 跑通与插件: docs/chapters/chapter-27.md
      - 第 28 章 算子覆盖分析: docs/chapters/chapter-28.md
      - 第 29 章 移植案例: docs/chapters/chapter-29.md
      - 第 30 章 精度回归与调优报告: docs/chapters/chapter-30.md

  - 第五部分 综合项目:
      - 本部分导览: docs/parts/part-5.md
      - 第 31 章 跨芯片推理优化报告: docs/chapters/chapter-31.md

  - 附录:
      - 阅读进度: docs/progress.md
      - 全书结构: docs/MODULES.md
      - 发表 benchmark 之前: docs/backmatter/benchmark.md
      - 决策点: docs/backmatter/decisions.md
      - 参考资料: docs/backmatter/references.md
      - 跟踪进度: docs/backmatter/tracking.md
      - 来源、贡献与许可: docs/backmatter/colophon.md
      - 基线报告模板: docs/modules/M0-foundations/baseline-report-template.md
      - 跨芯片对比报告模板: docs/modules/M3-domestic-chips/cross-chip-report-template.md
      - 上游英文原文: docs/original-README.md
