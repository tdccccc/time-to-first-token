# 《LLM 推理工程：原理与方法》（MkDocs + Material 主题），部署到 GitHub Pages。
# 结构：首页全景导览 + 5 篇 23 章主线 + 2 个独立横切区（参考手册与工具箱、进阶专题库）。
#
# 一章一文件：权威源稿位于 docs/chapters/、docs/topics/、docs/toolkit/ 与 docs/index.md。
# 推送到 main 后，.github/workflows/pages.yml 自动运行单测、构建并发布到 GitHub Pages。
site_name: LLM 推理工程：原理与方法
site_description: 面向工程师的 LLM 推理原理与方法精讲：性能直觉与度量、主流推理框架、GPU 算子优化与国产芯片适配。
site_url: https://tdccccc.github.io/time-to-first-token/
repo_url: https://github.com/tdccccc/time-to-first-token
repo_name: tdccccc/time-to-first-token
copyright: 基于 CC BY 4.0 发布 · 灵感源于 patchy631/time-to-first-token

docs_dir: site-src
site_dir: site

# 构建时把警告当错误：坏链接、未登记页面会直接让 CI 失败。
strict: true

theme:
  name: material
  language: zh
  custom_dir: overrides
  font: false
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

extra_css:
  - assets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - assets/math.js
  - assets/notes.js
  - assets/progress.js
  - assets/toc.js

plugins:
  - search:
      lang: zh

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - fenced_code
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 全景导览: index.md

  - 第一篇 性能直觉与度量方法:
      - 本篇导览: docs/parts/part-1.md
      - 第 1 章 推理为什么慢：Roofline 与三区间直觉: docs/chapters/chapter-01.md
      - 第 2 章 模型的显存与计算账本: docs/chapters/chapter-02.md
      - 第 3 章 推理度量与压测方法: docs/chapters/chapter-03.md
      - 第 4 章 Profiling 方法论：看时间花在哪: docs/chapters/chapter-04.md

  - 第二篇 推理引擎与部署优化:
      - 本篇导览: docs/parts/part-2.md
      - 第 5 章 vLLM：一条请求如何穿过推理引擎: docs/chapters/chapter-05.md
      - 第 6 章 SGLang：RadixAttention 与前缀复用: docs/chapters/chapter-06.md
      - 第 7 章 可观测性与容量评估: docs/chapters/chapter-07.md
      - 第 8 章 量化原理与取舍: docs/chapters/chapter-08.md
      - 第 9 章 投机解码与长上下文 KV 淘汰: docs/chapters/chapter-09.md
      - 第 10 章 TensorRT-LLM 与三引擎架构横评: docs/chapters/chapter-10.md
      - 第 11 章 生产架构：PD 解耦、扩缩容与成本路由: docs/chapters/chapter-11.md

  - 第三篇 GPU 算子优化与引擎接入:
      - 本篇导览: docs/parts/part-3.md
      - 第 12 章 GPU 执行模型与 GEMM 四版优化阶梯: docs/chapters/chapter-12.md
      - 第 13 章 Triton 编程模型：从向量加到 2D GEMM: docs/chapters/chapter-13.md
      - 第 14 章 Fused Attention 深讲：Online Softmax 与分块实现: docs/chapters/chapter-14.md
      - 第 15 章 量化 Matmul 算子原理：W8A8 与 W8A16: docs/chapters/chapter-15.md
      - 第 16 章 工业级实现导读：FlashAttention 2/3 与 CUTLASS: docs/chapters/chapter-16.md
      - 第 17 章 把自定义算子接入推理引擎: docs/chapters/chapter-17.md

  - 第四篇 国产芯片适配原理与方法:
      - 本篇导览: docs/parts/part-4.md
      - 第 18 章 国产芯片全景与软件栈地图: docs/chapters/chapter-18.md
      - 第 19 章 昇腾部署架构与 vllm-ascend 插件机制: docs/chapters/chapter-19.md
      - 第 20 章 CANN 分层与 AscendC 算子全链路: docs/chapters/chapter-20.md
      - 第 21 章 算子覆盖分析与回退定位方法: docs/chapters/chapter-21.md
      - 第 22 章 跨芯片算子迁移：从 CUDA / Triton 到 Ascend: docs/chapters/chapter-22.md

  - 第五篇 综合分析与方法收口:
      - 本篇导览: docs/parts/part-5.md
      - 第 23 章 跨芯片精度回归、性能归因与分析报告范式: docs/chapters/chapter-23.md

  - 进阶专题库:
      - 专题 A：前沿长上下文与混合架构拆账: docs/topics/advanced-architectures.md
      - 专题 B：大规模集群 PD 与分布式 KV 池: docs/topics/cluster-pd-mooncake.md
      - 专题 C：端侧与浏览器推理运行时: docs/topics/edge-runtimes.md
      - 专题 D：各章核心论文精读与数据口径: docs/topics/paper-notes.md
      - 专题 E：主流国产芯片生态速查: docs/topics/domestic-ecosystems.md

  - 参考手册与工具箱:
      - 硬件规格与模型账本速查: docs/toolkit/hardware-models.md
      - 测量口径与对比分析方法: docs/toolkit/methodology.md
      - 工程脚本与配置参考: docs/toolkit/tools-and-configs.md
      - 术语表: docs/glossary.md
      - 阅读进度: docs/progress.md
      - 来源、贡献与许可: docs/colophon.md
