<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" role="img" aria-label="双对数坐标 Roofline 模型：对比 A100 80GB 与 H100 SXM 的带宽与算力上限，标出 Llama-3.1-8B 的 Decode（batch=1、batch=32）与 Prefill（N=512）位置">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 23px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 14px; fill: #64748b; }
    .axis-label { font-size: 13px; font-weight: 600; fill: #475569; }
    .tick { font-size: 12.5px; fill: #64748b; }
    .region-title { font-size: 14px; font-weight: 700; }
    .region-sub { font-size: 11.5px; }
    .card-title { font-size: 12.5px; font-weight: 700; }
    .card-sub { font-size: 11.5px; }
    .note { font-size: 12.5px; fill: #334155; }
    .axis { stroke: #94a3b8; stroke-width: 1.5; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="920" height="450" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="38" y="38" class="title">Roofline 模型：先定瓶颈区间，再选优化手段</text>
  <text x="38" y="62" class="sub">双对数坐标；实线为 A100 80GB 主基线，虚线为 H100 SXM 对照；示例点按 Llama-3.1-8B（FP16）算术强度估算。</text>

  <!-- Plot background & shaded regions under A100 Roofline -->
  <rect x="104" y="94" width="760" height="258" fill="#ffffff"/>
  <!-- Memory-bound shaded region (left of A100 ridge x=630.2) -->
  <polygon points="104,352 630.2,157.1 630.2,352" fill="#eef2ff" opacity="0.82"/>
  <!-- Compute-bound shaded region (right of A100 ridge x=630.2) -->
  <polygon points="630.2,157.1 864,157.1 864,352 630.2,352" fill="#ecfdf5" opacity="0.82"/>

  <!-- Grid lines -->
  <g>
    <line x1="167.5" y1="94" x2="167.5" y2="352" class="grid"/>
    <line x1="378.5" y1="94" x2="378.5" y2="352" class="grid"/>
    <line x1="589.5" y1="94" x2="589.5" y2="352" class="grid"/>
    <line x1="800.5" y1="94" x2="800.5" y2="352" class="grid"/>
    <line x1="104" y1="273.8" x2="864" y2="273.8" class="grid"/>
    <line x1="104" y1="195.7" x2="864" y2="195.7" class="grid"/>
    <line x1="104" y1="117.5" x2="864" y2="117.5" class="grid"/>
  </g>

  <!-- Ridge vertical drops -->
  <line x1="688.7" y1="117.9" x2="688.7" y2="352" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="630.2" y1="157.1" x2="630.2" y2="352" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- H100 SXM Roofline (dashed comparison) -->
  <polyline points="104,334.5 688.7,117.9 864,117.9" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="7 5"/>
  <circle cx="688.7" cy="117.9" r="4.5" fill="#fbfcfe" stroke="#64748b" stroke-width="2"/>

  <!-- A100 80GB Roofline (primary solid indigo) -->
  <polyline points="104,352 630.2,157.1 864,157.1" fill="none" stroke="#3f51b5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="630.2" cy="157.1" r="5" fill="#3f51b5" stroke="#ffffff" stroke-width="2"/>

  <!-- Axes -->
  <line x1="104" y1="352" x2="868" y2="352" class="axis" marker-end="url(#arrow-axis)"/>
  <line x1="104" y1="352" x2="104" y2="90" class="axis" marker-end="url(#arrow-axis)"/>

  <!-- Axis ticks & titles -->
  <text x="167.5" y="370" class="tick mono" text-anchor="middle">1</text>
  <text x="378.5" y="370" class="tick mono" text-anchor="middle">10</text>
  <text x="589.5" y="370" class="tick mono" text-anchor="middle">100</text>
  <text x="800.5" y="370" class="tick mono" text-anchor="middle">1000</text>

  <text x="94" y="356" class="tick mono" text-anchor="end">1</text>
  <text x="94" y="278" class="tick mono" text-anchor="end">10</text>
  <text x="94" y="200" class="tick mono" text-anchor="end">100</text>
  <text x="94" y="122" class="tick mono" text-anchor="end">1000</text>

  <text x="484" y="393" class="axis-label" text-anchor="middle">算术强度 Arithmetic Intensity（FLOP / Byte，对数坐标）→</text>
  <text x="38" y="86" class="axis-label">可达性能（TFLOPS，对数）↑</text>

  <!-- Hardware ceiling & ridge annotations -->
  <text x="680" y="108" font-size="11.5" font-weight="600" fill="#475569" text-anchor="end">H100 脊点 295</text>
  <text x="860" y="108" font-size="11.5" font-weight="600" fill="#475569" text-anchor="end">H100 SXM · 989.5 TFLOPS</text>
  <text x="860" y="147" font-size="11.5" font-weight="700" fill="#3f51b5" text-anchor="end">A100 · 312 TFLOPS</text>
  <text x="622" y="340" font-size="12" font-weight="700" fill="#3730a3" text-anchor="end">A100 脊点 156 FLOP/B</text>

  <!-- Region labels -->
  <text x="348" y="318" class="region-title" fill="#3730a3" text-anchor="middle">带宽受限区（Memory-Bound）</text>
  <text x="348" y="336" class="region-sub" fill="#4f46e5" text-anchor="middle">斜坡段：性能 = 算术强度 × 显存带宽</text>

  <text x="748" y="318" class="region-title" fill="#065f46" text-anchor="middle">计算受限区（Compute-Bound）</text>
  <text x="748" y="336" class="region-sub" fill="#047857" text-anchor="middle">平台段：性能受限于芯片峰值算力</text>

  <!-- Legend box (top-left open area) -->
  <g>
    <rect x="114" y="104" width="218" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <line x1="126" y1="124" x2="154" y2="124" stroke="#3f51b5" stroke-width="3.5" stroke-linecap="round"/>
    <text x="162" y="128" font-size="11.5" font-weight="600" fill="#1e293b">A100 80GB: 312T / 2 TB/s</text>
    <line x1="126" y1="146" x2="154" y2="146" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6 4"/>
    <text x="162" y="150" font-size="11.5" fill="#475569">H100 SXM: 989.5T / 3.35 TB/s</text>
  </g>

  <!-- Example Point 1: Decode batch=1 (AI≈1) -->
  <line x1="167.5" y1="238" x2="167.5" y2="320" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3 2"/>
  <circle cx="167.5" cy="328.5" r="6.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <g>
    <rect x="114" y="184" width="194" height="54" rx="7" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
    <text x="126" y="205" class="card-title" fill="#92400e">① Decode（batch = 1）</text>
    <text x="126" y="225" class="card-sub" fill="#b45309">AI ≈ 1 · 深度带宽受限（≈2 TF）</text>
  </g>

  <!-- Example Point 2: Decode batch=32 (AI≈32) -->
  <line x1="464" y1="158" x2="482" y2="203" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="3 2"/>
  <circle cx="485.1" cy="210.8" r="6.5" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <g>
    <rect x="344" y="104" width="192" height="54" rx="7" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="356" y="125" class="card-title" fill="#075985">② Decode（batch = 32）</text>
    <text x="356" y="145" class="card-sub" fill="#0369a1">AI ≈ 32 · 沿斜坡爬升，仍带宽受限</text>
  </g>

  <!-- Example Point 3: Prefill N=512 (AI≈512) -->
  <line x1="739.1" y1="194" x2="739.1" y2="165" stroke="#059669" stroke-width="1.4" stroke-dasharray="3 2"/>
  <circle cx="739.1" cy="157.1" r="6.5" fill="#059669" stroke="#ffffff" stroke-width="2"/>
  <g>
    <rect x="656" y="194" width="200" height="54" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
    <text x="668" y="215" class="card-title" fill="#065f46">③ Prefill（N = 512）</text>
    <text x="668" y="235" class="card-sub" fill="#047857">AI ≈ 512 · 越过脊点，计算受限</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="38" y="405" width="844" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="423" class="note"><tspan font-weight="700" fill="#1e293b">工程直觉：</tspan>H100 算力涨 3.2× 而带宽仅涨 1.7×，脊点右移至 295——小 batch 仍卡带宽，大 batch / Prefill 才吃满算力。</text>
</svg>
