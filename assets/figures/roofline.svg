<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Roofline 模型：横轴算术强度，纵轴可达性能，交点为脊点">
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.title{font-size:25px;font-weight:700;fill:#1f2937}
.sub{font-size:15px;fill:#64748b}
.label{font-size:18px;font-weight:600;fill:#1f2937}
.small{font-size:14px;fill:#64748b}
.tick{font-size:13px;fill:#64748b}
.axis{stroke:#94a3b8;stroke-width:1.5}
.grid{stroke:#e2e8f0;stroke-width:1}
</style>
<rect width="900" height="430" fill="#fbfcfe"/>
<text x="40" y="40" class="title">Roofline：先定位，再优化</text>
<text x="40" y="64" class="sub">示意：A100 80GB 公开规格算例；双对数坐标；斜线是带宽上限，横线是算力上限。</text>

<g>
<line x1="100" y1="90" x2="100" y2="350" class="axis"/>
<line x1="100" y1="350" x2="840" y2="350" class="axis"/>
<line x1="152.9" y1="90" x2="152.9" y2="350" class="grid"/>
<line x1="328.5" y1="90" x2="328.5" y2="350" class="grid"/>
<line x1="504.0" y1="90" x2="504.0" y2="350" class="grid"/>
<line x1="679.6" y1="90" x2="679.6" y2="350" class="grid"/>
<line x1="100" y1="263.3" x2="840" y2="263.3" class="grid"/>
<line x1="100" y1="176.7" x2="840" y2="176.7" class="grid"/>
<line x1="100" y1="90" x2="840" y2="90" class="grid"/>
</g>
<polygon points="100,350 537.9,133.8 840,133.8 840,350" fill="#eef2ff"/>
<line x1="100" y1="350" x2="537.9" y2="133.8" stroke="#3f51b5" stroke-width="4"/>
<line x1="537.9" y1="133.8" x2="840" y2="133.8" stroke="#3f51b5" stroke-width="4"/>
<line x1="537.9" y1="133.8" x2="537.9" y2="350" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>

<circle cx="152.9" cy="323.9" r="6" fill="#f59e0b"/>
<circle cx="629.3" cy="133.8" r="6" fill="#0f9f6e"/>
<line x1="160" y1="318" x2="154" y2="323" stroke="#f59e0b" stroke-width="1.2"/>
<line x1="642" y1="128" x2="632" y2="133" stroke="#0f9f6e" stroke-width="1.2"/>
<line x1="530" y1="126" x2="536" y2="132" stroke="#94a3b8" stroke-width="1.2"/>

<text x="110" y="244" class="small">decode：算术强度≈1</text>
<text x="110" y="262" class="small">带宽受限</text>
<line x1="160" y1="270" x2="154" y2="318" stroke="#f59e0b" stroke-width="1.2"/>
<text x="644" y="100" class="small" style="font-weight:600;fill:#1f2937">prefill：算术强度≈517</text>
<text x="644" y="118" class="small">越过脊点，计算受限</text>
<text x="528" y="122" class="small" text-anchor="end">脊点 156 FLOP/字节</text>

<text x="300" y="330" class="label" fill="#3f51b5">带宽区间</text>
<text x="650" y="230" class="label" fill="#3f51b5">计算区间</text>
<line x1="600" y1="293" x2="618" y2="287" stroke="#3f51b5" stroke-width="3"/>
<text x="624" y="294" class="small">带宽上限</text>
<rect x="600" y="311" width="18" height="7" fill="#3f51b5"/>
<text x="624" y="318" class="small">算力上限</text>

<text x="153" y="369" class="tick" text-anchor="middle">1</text>
<text x="328.5" y="369" class="tick" text-anchor="middle">10</text>
<text x="504" y="369" class="tick" text-anchor="middle">100</text>
<text x="679.6" y="369" class="tick" text-anchor="middle">1000</text>
<text x="84" y="354" class="tick" text-anchor="end">1</text>
<text x="84" y="267" class="tick" text-anchor="end">10</text>
<text x="84" y="181" class="tick" text-anchor="end">100</text>
<text x="84" y="94" class="tick" text-anchor="end">1000</text>
<text x="470" y="394" class="small" text-anchor="middle">算术强度（FLOP/字节，对数）→</text>
<text x="100" y="84" class="small">可达性能（TFLOPS，对数）↑</text>
</svg>
