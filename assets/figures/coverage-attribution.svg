<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="覆盖矩阵归因：覆盖率与热点集中度决定瓶颈在算子覆盖还是调度、显存、通信">
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.title{font-size:26px;font-weight:700;fill:#1f2937}.sub{font-size:16px;fill:#6b7280}
.label{font-size:20px;font-weight:700}.small{font-size:15px;fill:#4b5563}
.tick{font-size:15px;fill:#6b7280}.axis{stroke:#94a3b8;stroke-width:1.5}
.threshold{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}
</style>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
</marker>
</defs>
<rect width="900" height="430" fill="#fbfcfe"/>
<text x="40" y="42" class="title">覆盖矩阵的归因：覆盖率 × 热点集中度</text>
<text x="40" y="68" class="sub">三列覆盖率一起报；横轴是耗时加权执行覆盖率，纵轴是 Top 3 耗时占比。</text>

<rect x="120" y="96" width="370" height="124" fill="#fff7ed"/>
<rect x="490" y="96" width="370" height="124" fill="#ecfdf5"/>
<rect x="120" y="220" width="370" height="124" fill="#eff6ff"/>
<rect x="490" y="220" width="370" height="124" fill="#eef2ff"/>

<line x1="120" y1="344" x2="860" y2="344" class="axis" marker-end="url(#arrow)"/>
<line x1="120" y1="344" x2="120" y2="96" class="axis" marker-end="url(#arrow)"/>
<line x1="490" y1="96" x2="490" y2="344" class="threshold"/>
<line x1="120" y1="220" x2="860" y2="220" class="threshold"/>

<text x="130" y="364" class="tick">低</text>
<text x="490" y="364" class="tick" text-anchor="middle">80%</text>
<text x="850" y="364" class="tick" text-anchor="end">高</text>
<text x="112" y="338" class="tick" text-anchor="end">低</text>
<text x="112" y="226" class="tick" text-anchor="end">50%</text>
<text x="112" y="104" class="tick" text-anchor="end">高</text>

<text x="490" y="386" class="small" text-anchor="middle">耗时加权执行覆盖率 C_time →</text>
<text x="42" y="220" class="small" text-anchor="middle" transform="rotate(-90 42 220)">Top 3 耗时占比 H3 →</text>

<text x="145" y="132" class="label" fill="#b45309">补算子</text>
<text x="145" y="157" class="small" fill="#92400e">低覆盖 + 热点集中</text>
<text x="145" y="181" class="small" fill="#92400e">先补 Top 3 未覆盖项</text>
<text x="145" y="204" class="small" fill="#92400e">用 1+p(s−1) 估收益</text>

<text x="515" y="132" class="label" fill="#047857">覆盖不是瓶颈</text>
<text x="515" y="157" class="small" fill="#065f46">高覆盖 + 热点集中</text>
<text x="515" y="181" class="small" fill="#065f46">查热点算子的实现质量</text>
<text x="515" y="204" class="small" fill="#065f46">与调度、显存</text>

<text x="145" y="256" class="label" fill="#0369a1">按权重补长尾</text>
<text x="145" y="281" class="small" fill="#075985">低覆盖 + 热点分散</text>
<text x="145" y="305" class="small" fill="#075985">只补高权重项</text>
<text x="145" y="328" class="small" fill="#075985">收益有限</text>

<text x="515" y="256" class="label" fill="#047857">覆盖不是瓶颈</text>
<text x="515" y="281" class="small" fill="#065f46">高覆盖 + 热点分散</text>
<text x="515" y="305" class="small" fill="#065f46">查调度、显存、通信</text>
<text x="515" y="328" class="small" fill="#065f46">与 kernel 效率</text>

<text x="40" y="404" class="small">阈值 80% / 50% 为默认值，可按模型调整。</text>
<text x="40" y="424" class="small">回退算子没有设备时间，C_time 会高估覆盖率，需同时报 C_call 与 CPU 自耗时。</text>
</svg>
