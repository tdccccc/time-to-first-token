<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-label="vLLM V1 双进程架构与请求生命周期状态机：上半展示 API 进程与 EngineCore 进程通过 IPC 协同；下半展示 WAITING、RUNNING（Prefill 与 Decode）、FINISHED 及显存不足触发 PREEMPTED 重算闭环">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 23px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 14px; fill: #64748b; }
    .proc-title { font-size: 14.5px; font-weight: 700; }
    .proc-sub { font-size: 11.5px; }
    .step-txt { font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .role-zh { font-size: 13.5px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .role-en { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .role-desc { font-size: 11px; fill: #475569; text-anchor: middle; }
    .state-name { font-size: 13.5px; font-weight: 700; text-anchor: middle; }
    .state-sub { font-size: 11.5px; text-anchor: middle; }
    .edge-lbl { font-size: 11px; font-weight: 600; }
    .note { font-size: 12.5px; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="920" height="470" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="38" y="38" class="title">vLLM V1 双进程架构与请求生命周期</text>
  <text x="38" y="62" class="sub">上：API 进程与 EngineCore 通过 IPC 解耦，避免编解码阻塞 GPU；下：请求调度状态机与显存吃紧抢占闭环。</text>

  <!-- ==================== TOP HALF: V1 DUAL-PROCESS ==================== -->
  <!-- Left: API Process -->
  <g>
    <rect x="38" y="80" width="228" height="168" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="54" y="103" class="proc-title" fill="#075985">API 进程（前端）</text>
    <text x="176" y="103" class="proc-sub" fill="#0284c7">异步 HTTP</text>

    <rect x="54" y="114" width="196" height="32" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="152" y="134.5" class="step-txt">① 接收 OpenAI 请求</text>

    <line x1="152" y1="146" x2="152" y2="156" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-sky)"/>

    <rect x="54" y="158" width="196" height="32" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="152" y="178.5" class="step-txt">② Tokenize（文本 → ID）</text>

    <rect x="54" y="202" width="196" height="32" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="152" y="222.5" class="step-txt" fill="#065f46">③ 流式 Detokenize 返回</text>
  </g>

  <!-- Middle IPC Bridge -->
  <g>
    <!-- Forward IPC: Token IDs -> EngineCore -->
    <text x="310" y="156" class="edge-lbl mono" fill="#0369a1" text-anchor="middle">ZMQ IPC</text>
    <text x="310" y="169" font-size="10.5" fill="#64748b" text-anchor="middle">请求 + Token ID</text>
    <line x1="268" y1="175" x2="350" y2="175" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-sky)"/>

    <!-- Backward IPC: Generated Token IDs -> API -->
    <line x1="350" y1="218" x2="268" y2="218" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-emerald)"/>
    <text x="310" y="210" class="edge-lbl" fill="#047857" text-anchor="middle">生成 Token</text>
    <text x="310" y="232" font-size="10.5" fill="#64748b" text-anchor="middle">流式回传</text>
  </g>

  <!-- Right: EngineCore Process -->
  <g>
    <rect x="354" y="80" width="528" height="168" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="370" y="103" class="proc-title" fill="#3730a3">EngineCore 进程（推理核心循环）</text>
    <text x="614" y="103" class="proc-sub" fill="#4f46e5">隔离 GIL · 专注 GPU 步进执行</text>

    <!-- Role 1: Scheduler -->
    <rect x="368" y="114" width="113" height="98" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <rect x="368" y="114" width="113" height="5" rx="2.5" fill="#4f46e5"/>
    <text x="424.5" y="138" class="role-zh">调度器</text>
    <text x="424.5" y="153" class="role-en mono" fill="#4f46e5">Scheduler</text>
    <text x="424.5" y="173" class="role-desc">决定本步组批</text>
    <text x="424.5" y="188" class="role-desc">控制 Token 预算</text>
    <text x="424.5" y="203" class="role-desc">触发抢占与恢复</text>

    <line x1="481" y1="163" x2="494" y2="163" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Role 2: KV Manager -->
    <rect x="497" y="114" width="113" height="98" rx="8" fill="#ffffff" stroke="#bae6fd"/>
    <rect x="497" y="114" width="113" height="5" rx="2.5" fill="#0284c7"/>
    <text x="553.5" y="138" class="role-zh">KV 管理器</text>
    <text x="553.5" y="153" class="role-en mono" fill="#0284c7">KV Manager</text>
    <text x="553.5" y="173" class="role-desc">按块分配物理页</text>
    <text x="553.5" y="188" class="role-desc">维护块表映射</text>
    <text x="553.5" y="203" class="role-desc">前缀缓存复用</text>

    <line x1="610" y1="163" x2="623" y2="163" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Role 3: ModelRunner -->
    <rect x="626" y="114" width="113" height="98" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <rect x="626" y="114" width="113" height="5" rx="2.5" fill="#059669"/>
    <text x="682.5" y="138" class="role-zh">模型执行器</text>
    <text x="682.5" y="153" class="role-en mono" fill="#059669">ModelRunner</text>
    <text x="682.5" y="173" class="role-desc">组装输入与块表</text>
    <text x="682.5" y="188" class="role-desc">调用 GPU 前向</text>
    <text x="682.5" y="203" class="role-desc">CUDA Graph 复放</text>

    <line x1="739" y1="163" x2="752" y2="163" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Role 4: Sampler -->
    <rect x="755" y="114" width="113" height="98" rx="8" fill="#ffffff" stroke="#fde68a"/>
    <rect x="755" y="114" width="113" height="5" rx="2.5" fill="#d97706"/>
    <text x="811.5" y="138" class="role-zh">采样器</text>
    <text x="811.5" y="153" class="role-en mono" fill="#d97706">Sampler</text>
    <text x="811.5" y="173" class="role-desc">温度与惩罚缩放</text>
    <text x="811.5" y="188" class="role-desc">Top-p / Top-k</text>
    <text x="811.5" y="203" class="role-desc">产出新 Token ID</text>

    <!-- Engine step feedback loop -->
    <path d="M811.5,212 L811.5,226 L424.5,226 L424.5,215" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-indigo)"/>
    <text x="618" y="240" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">每步迭代更新队列状态（Continuous Batching）</text>
  </g>

  <!-- ==================== BOTTOM HALF: REQUEST LIFECYCLE FSM ==================== -->
  <rect x="38" y="260" width="844" height="162" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="54" y="283" font-size="14.5" font-weight="700" fill="#1e293b">请求生命周期状态机（Scheduler 调度视角）</text>

  <!-- State 1: WAITING -->
  <rect x="58" y="297" width="142" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="129" y="319" class="state-name mono" fill="#334155">WAITING</text>
  <text x="129" y="338" class="state-sub" fill="#64748b">排队等待 KV 配额</text>

  <!-- Transition: WAITING -> RUNNING -->
  <line x1="200" y1="323" x2="258" y2="323" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <text x="229" y="314" class="edge-lbl" fill="#4f46e5" text-anchor="middle">分配 KV 块</text>

  <!-- State 2: RUNNING (Composite: Prefill -> Decode) -->
  <rect x="262" y="290" width="388" height="66" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="276" y="309" font-size="13" font-weight="700" class="mono" fill="#3730a3">RUNNING</text>
  <text x="348" y="309" font-size="11.5" fill="#4f46e5">持有物理 KV 块，参与每步前向</text>

  <rect x="276" y="318" width="158" height="29" rx="6" fill="#ffffff" stroke="#818cf8"/>
  <text x="355" y="337" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">Prefill（处理提示词）</text>

  <line x1="434" y1="332.5" x2="458" y2="332.5" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>

  <rect x="462" y="318" width="174" height="29" rx="6" fill="#ffffff" stroke="#818cf8"/>
  <text x="549" y="337" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">逐 Token Decode ↻</text>

  <!-- Transition: RUNNING -> FINISHED -->
  <line x1="650" y1="323" x2="718" y2="323" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="684" y="314" class="edge-lbl" fill="#059669" text-anchor="middle">EOS / 达上限</text>

  <!-- State 3: FINISHED -->
  <rect x="722" y="297" width="140" height="52" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="792" y="319" class="state-name mono" fill="#065f46">FINISHED</text>
  <text x="792" y="338" class="state-sub" fill="#047857">归还全部物理 KV 块</text>

  <!-- Preemption Loop: RUNNING -> PREEMPTED -> WAITING -->
  <path d="M560,356 L560,393 L523,393" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-rose)"/>
  <text x="572" y="388" class="edge-lbl" fill="#dc2626">显存吃紧（KV 块耗尽）</text>
  <text x="572" y="405" font-size="11" fill="#b91c1c">驱逐低优先请求以腾出显存</text>

  <rect x="282" y="373" width="238" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="401" y="390" font-size="13" font-weight="700" class="mono" fill="#991b1b" text-anchor="middle">PREEMPTED</text>
  <text x="401" y="406" font-size="11" fill="#b91c1c" text-anchor="middle">丢弃 KV 块（V1 默认重算恢复）</text>

  <path d="M282,393 L129,393 L129,352" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-rose)"/>
  <text x="206" y="386" class="edge-lbl" fill="#b91c1c" text-anchor="middle">重回队首，待重算 Prefill</text>

  <!-- Bottom takeaway -->
  <rect x="38" y="431" width="844" height="25" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="447.5" class="note"><tspan font-weight="700" fill="#1e293b">排障视角：</tspan>若观测到抢占计数上升或 WAITING 队列持续积压，说明 KV 池触顶，应先核对并发预算、序列长度与前缀命中率。</text>
</svg>
