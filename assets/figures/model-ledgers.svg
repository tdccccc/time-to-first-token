<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="五个模型的总参数与每 8K 请求全局 KV 对照：两列均为对数轴，参数规模与 KV 账并不同向">
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.title{font-size:25px;font-weight:700;fill:#1f2937}
.sub{font-size:15px;fill:#6b7280}
.ptitle{font-size:17px;font-weight:700;fill:#1f2937}
.row{font-size:15px;fill:#1f2937}
.val{font-size:14px;fill:#374151}
.tick{font-size:13px;fill:#6b7280}
.note{font-size:13.5px;fill:#6b7280}
</style>
<rect width="900" height="430" fill="#fbfcfe"/>
<text x="40" y="40" class="title">参数规模与 KV 账并不同向</text>
<text x="40" y="64" class="sub">同一行是一个模型；左列总参数，右列每 8K 请求的全局 KV，两列都是对数轴，固定状态另计。</text>
<text x="200" y="102" class="ptitle">总参数（B）</text>
<text x="570" y="102" class="ptitle">每 8K 请求全局 KV（MiB）</text>
<line x1="227.0" y1="120" x2="227.0" y2="330" stroke="#e5e7eb" stroke-width="1"/>
<text x="227.0" y="348" class="tick" text-anchor="middle">10</text>
<line x1="604.0" y1="120" x2="604.0" y2="330" stroke="#e5e7eb" stroke-width="1"/>
<text x="604.0" y="348" class="tick" text-anchor="middle">10</text>
<line x1="316.5" y1="120" x2="316.5" y2="330" stroke="#e5e7eb" stroke-width="1"/>
<text x="316.5" y="348" class="tick" text-anchor="middle">100</text>
<line x1="717.1" y1="120" x2="717.1" y2="330" stroke="#e5e7eb" stroke-width="1"/>
<text x="717.1" y="348" class="tick" text-anchor="middle">100</text>
<line x1="406.1" y1="120" x2="406.1" y2="330" stroke="#e5e7eb" stroke-width="1"/>
<text x="406.1" y="348" class="tick" text-anchor="middle">1,000</text>
<line x1="830.1" y1="120" x2="830.1" y2="330" stroke="#e5e7eb" stroke-width="1"/>
<text x="830.1" y="348" class="tick" text-anchor="middle">1,000</text>
<line x1="200" y1="330" x2="460" y2="330" stroke="#cbd5e1" stroke-width="1.2"/>
<line x1="570" y1="330" x2="850" y2="330" stroke="#cbd5e1" stroke-width="1.2"/>
<line x1="520" y1="112" x2="520" y2="330" stroke="#e5e7eb" stroke-width="1"/>
<text x="40" y="150" class="row">Qwen3-8B</text>
<line x1="219.2" y1="145" x2="466" y2="145" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="219.2" cy="145" r="10" fill="#6366f1" opacity="0.13"/>
<circle cx="219.2" cy="145" r="5.5" fill="#6366f1"/>
<text x="470" y="150" class="val">8.19</text>
<circle cx="837.0" cy="145" r="10" fill="#6366f1" opacity="0.13"/>
<circle cx="837.0" cy="145" r="5.5" fill="#6366f1"/>
<text x="849.0" y="150" class="val">1,152</text>
<text x="40" y="190" class="row">Qwen3.6</text>
<line x1="275.3" y1="185" x2="466" y2="185" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="275.3" cy="185" r="10" fill="#0891b2" opacity="0.13"/>
<circle cx="275.3" cy="185" r="5.5" fill="#0891b2"/>
<text x="470" y="190" class="val">34.66</text>
<circle cx="740.1" cy="185" r="10" fill="#0891b2" opacity="0.13"/>
<circle cx="740.1" cy="185" r="5.5" fill="#0891b2"/>
<text x="752.1" y="190" class="val">160</text>
<text x="40" y="230" class="row">V4-Flash</text>
<line x1="357.2" y1="225" x2="466" y2="225" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="357.2" cy="225" r="10" fill="#16a34a" opacity="0.13"/>
<circle cx="357.2" cy="225" r="5.5" fill="#16a34a"/>
<text x="470" y="230" class="val">284.3</text>
<circle cx="653.6" cy="225" r="10" fill="#16a34a" opacity="0.13"/>
<circle cx="653.6" cy="225" r="5.5" fill="#16a34a"/>
<text x="665.6" y="230" class="val">27.46</text>
<text x="40" y="270" class="row">V4.1 Flash</text>
<line x1="394.8" y1="265" x2="466" y2="265" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="394.8" cy="265" r="10" fill="#d97706" opacity="0.13"/>
<circle cx="394.8" cy="265" r="5.5" fill="#d97706"/>
<text x="470" y="270" class="val">748.5</text>
<circle cx="586.2" cy="265" r="10" fill="#d97706" opacity="0.13"/>
<circle cx="586.2" cy="265" r="5.5" fill="#d97706"/>
<text x="598.2" y="270" class="val">6.953</text>
<text x="40" y="310" class="row">Kimi K3</text>
<line x1="445.8" y1="305" x2="466" y2="305" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="445.8" cy="305" r="10" fill="#db2777" opacity="0.13"/>
<circle cx="445.8" cy="305" r="5.5" fill="#db2777"/>
<text x="470" y="310" class="val">2,779</text>
<circle cx="754.9" cy="305" r="10" fill="#db2777" opacity="0.13"/>
<circle cx="754.9" cy="305" r="5.5" fill="#db2777"/>
<text x="766.9" y="310" class="val">216</text>
<text x="40" y="376" class="note">读法：参数从少到多排，KV 没有跟着同向变化。</text>
<text x="40" y="397" class="note">Qwen3-8B 参数最少、KV 最大；V4.1 Flash 参数第二、KV 最小。</text>
<text x="40" y="418" class="note">口径：V4-Flash/V4.1 为生产混合格式；其余按表 7.4 的 BF16/紧凑 MLA/混合口径；V4.1 总数含 Engram。</text>
</svg>
