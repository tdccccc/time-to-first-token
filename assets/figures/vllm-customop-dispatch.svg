<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-label="vLLM CustomOp 完整三阶段状态机（启动注册期、实例构造期、执行分发期）与三类常见静默失效点">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 23px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 14px; fill: #64748b; }
    .phase-hd { font-size: 13.5px; font-weight: 700; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .box-t { font-size: 11.5px; font-weight: 700; fill: #1e293b; }
    .box-s { font-size: 10.5px; fill: #475569; }
    .fail-t { font-size: 12px; font-weight: 700; fill: #dc2626; }
    .fail-s { font-size: 10.5px; fill: #7f1d1d; }
    .fail-fix { font-size: 10px; font-weight: 700; fill: #991b1b; }
    .note { font-size: 12.5px; fill: #334155; }
  </style>
  <defs>
    <marker id="arr-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="arr-sub" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="920" height="470" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="36" y="38" class="title">vLLM CustomOp：三阶段注册分发状态机与静默失效</text>
  <text x="36" y="61" class="sub">自定义算子生效需完整贯通注册、构造与分发三阶段；红色分支为三类高频无报错静默回退陷阱。</text>

  <!-- ==================== Phase 1: Startup Registration ==================== -->
  <rect x="36" y="78" width="264" height="222" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.4"/>
  <path d="M36,88 a10,10 0 0 1 10,-10 h244 a10,10 0 0 1 10,10 v24 h-264 z" fill="#eef2ff"/>
  <line x1="36" y1="112" x2="300" y2="112" stroke="#c7d2fe" stroke-width="1"/>
  <circle cx="56" cy="95" r="10" fill="#3f51b5"/>
  <text x="56" y="99" class="num" text-anchor="middle">1</text>
  <text x="73" y="100" class="phase-hd" fill="#3f51b5">启动注册期（Plugin 加载）</text>

  <rect x="50" y="122" width="236" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="168" y="139" class="mono box-t" text-anchor="middle">pyproject.toml 入口发现</text>
  <text x="168" y="156" class="mono" font-size="9.8" fill="#475569" text-anchor="middle">vllm.general_plugins → register()</text>

  <line x1="168" y1="166" x2="168" y2="178" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-sub)"/>

  <rect x="50" y="180" width="236" height="44" rx="6" fill="#eef2ff" stroke="#818cf8"/>
  <text x="168" y="198" class="mono box-t" fill="#3f51b5" text-anchor="middle">@SiluAndMul.register_oot</text>
  <text x="168" y="214" class="box-s" text-anchor="middle">导入子类模块时执行装饰器</text>

  <line x1="168" y1="224" x2="168" y2="236" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-sub)"/>

  <rect x="50" y="238" width="236" height="48" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="168" y="257" class="box-t" fill="#047857" text-anchor="middle">写入全局 OOT 注册表</text>
  <text x="168" y="275" class="mono box-s" fill="#1e293b" text-anchor="middle">op_registry_oot["SiluAndMul"]</text>

  <!-- Arrow Phase 1 -> Phase 2 -->
  <line x1="300" y1="189" x2="325" y2="189" stroke="#475569" stroke-width="2" marker-end="url(#arr-main)"/>

  <!-- ==================== Phase 2: Instance Construction ==================== -->
  <rect x="328" y="78" width="264" height="222" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.4"/>
  <path d="M328,88 a10,10 0 0 1 10,-10 h244 a10,10 0 0 1 10,10 v24 h-264 z" fill="#e0f2fe"/>
  <line x1="328" y1="112" x2="592" y2="112" stroke="#bae6fd" stroke-width="1"/>
  <circle cx="348" cy="95" r="10" fill="#0284c7"/>
  <text x="348" y="99" class="num" text-anchor="middle">2</text>
  <text x="365" y="100" class="phase-hd" fill="#0284c7">实例构造期（__new__ / 分发）</text>

  <rect x="342" y="122" width="236" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="460" y="142" class="mono box-t" text-anchor="middle">CustomOp.__new__(cls)</text>
  <text x="460" y="161" class="box-s" text-anchor="middle">查 op_registry_oot 替换为自定义子类</text>

  <line x1="460" y1="174" x2="460" y2="188" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-sub)"/>

  <rect x="342" y="190" width="236" height="96" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="460" y="210" class="mono box-t" fill="#0369a1" text-anchor="middle">dispatch_forward()</text>
  <text x="354" y="231" class="box-s" fill="#1e293b">1. 核对 custom_ops 启用开关</text>
  <text x="366" y="249" class="mono box-s" fill="#0369a1">白名单须驼峰名 "+SiluAndMul"</text>
  <text x="354" y="271" class="box-s" fill="#1e293b">2. 按运行平台绑定 _forward_method</text>

  <!-- Arrow Phase 2 -> Phase 3 -->
  <line x1="592" y1="189" x2="617" y2="189" stroke="#475569" stroke-width="2" marker-end="url(#arr-main)"/>

  <!-- ==================== Phase 3: Execution Dispatch ==================== -->
  <rect x="620" y="78" width="264" height="222" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.4"/>
  <path d="M620,88 a10,10 0 0 1 10,-10 h244 a10,10 0 0 1 10,10 v24 h-264 z" fill="#ecfdf5"/>
  <line x1="620" y1="112" x2="884" y2="112" stroke="#a7f3d0" stroke-width="1"/>
  <circle cx="640" cy="95" r="10" fill="#059669"/>
  <text x="640" y="99" class="num" text-anchor="middle">3</text>
  <text x="657" y="100" class="phase-hd" fill="#059669">执行分发期（forward 路由）</text>

  <rect x="634" y="122" width="236" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="752" y="142" class="mono box-t" text-anchor="middle">forward() → _forward_method()</text>

  <line x1="752" y1="154" x2="752" y2="164" stroke="#64748b" stroke-width="1.2"/>

  <!-- Target 1: forward_cuda -->
  <rect x="634" y="166" width="236" height="34" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="644" y="187" class="mono" font-size="11" font-weight="700" fill="#0369a1">forward_cuda()</text>
  <text x="860" y="187" class="box-s" text-anchor="end">CUDA / ROCm</text>

  <!-- Target 2: forward_oot -->
  <rect x="634" y="208" width="236" height="36" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="644" y="230" class="mono" font-size="11" font-weight="700" fill="#047857">forward_oot()</text>
  <text x="860" y="230" class="box-s" font-weight="700" fill="#047857" text-anchor="end">插件 OOT 首选</text>

  <!-- Target 3: forward_native -->
  <rect x="634" y="252" width="236" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="644" y="273" class="mono" font-size="11" font-weight="700" fill="#b45309">forward_native()</text>
  <text x="860" y="273" class="box-s" text-anchor="end">PyTorch 兜底</text>

  <!-- ==================== Red Silent Failure Branches ==================== -->
  <!-- Failure 1 -->
  <line x1="168" y1="300" x2="168" y2="327" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <text x="178" y="318" class="fail-fix">静默分支 ①</text>

  <rect x="36" y="330" width="264" height="94" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="50" y="351" class="fail-t">失效 ①：漏 import 导致未注册</text>
  <text x="50" y="371" class="fail-s">插件入口漏导入算子模块，装饰器未触发</text>
  <text x="50" y="389" class="fail-s">结果：op_registry_oot 为空，构造原基类</text>
  <text x="50" y="410" class="mono fail-fix">排查：核对 general_plugins 与 import</text>

  <!-- Failure 2 -->
  <line x1="460" y1="300" x2="460" y2="327" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <text x="470" y="318" class="fail-fix">静默分支 ②</text>

  <rect x="328" y="330" width="264" height="94" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="342" y="351" class="fail-t">失效 ②：custom_ops 开关 / 键名错</text>
  <text x="342" y="371" class="fail-s">inductor 默认 custom_ops=none 关闭覆盖</text>
  <text x="342" y="389" class="fail-s">或键名误写蛇形 silu_and_mul（应驼峰）</text>
  <text x="342" y="410" class="mono fail-fix">排查：显式传 "+SiluAndMul" 或 "all"</text>

  <!-- Failure 3 -->
  <line x1="752" y1="300" x2="752" y2="327" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <text x="762" y="318" class="fail-fix">静默分支 ③</text>

  <rect x="620" y="330" width="264" height="94" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="634" y="351" class="fail-t">失效 ③：覆盖方法名非 forward_oot</text>
  <text x="634" y="371" class="fail-s">子类误写 forward_custom / forward_npu</text>
  <text x="634" y="389" class="fail-s">未覆盖基类约定的 forward_oot 钩子</text>
  <text x="634" y="410" class="mono fail-fix">结果：无报错静默回退 forward_native</text>

  <!-- Bottom takeaway -->
  <text x="36" y="448" class="note">验证金标准：模型初始化后打印 type(op) 与 op._forward_method.__qualname__，双项命中方确认插件算子真正接管执行。</text>
</svg>
