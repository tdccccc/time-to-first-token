<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-label="注意力 KV 缓存演进与 MoE 稀疏路由：左半对比 MHA、GQA、MLA 的 Q/KV 头映射与 8K 上下文容量差距；右半展示 MoE Router Top-2 激活 2/8 专家">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 23px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 14px; fill: #64748b; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .panel-sub { font-size: 11.5px; fill: #64748b; }
    .row-tag { font-size: 14px; font-weight: 700; }
    .row-sub { font-size: 11.5px; }
    .cap-badge { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .blk-lbl { font-size: 10.5px; font-weight: 700; }
    .exp-t { font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    .exp-s { font-size: 9.5px; text-anchor: middle; }
    .note { font-size: 12.5px; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="920" height="480" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="38" y="38" class="title">注意力 KV 缓存演进与 MoE 稀疏路由</text>
  <text x="38" y="62" class="sub">左：MHA → GQA → MLA 逐代压缩 KV 显存；右：MoE 解耦“总参数驻留显存”与“单 Token 激活算力”。</text>

  <!-- ==================== LEFT PANEL: MHA vs GQA vs MLA ==================== -->
  <rect x="38" y="80" width="456" height="350" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="54" y="105" class="panel-title">KV 缓存演进：MHA vs GQA vs MLA（8 个 Q 头示意）</text>
  <text x="54" y="123" class="panel-sub">容量参照：32 层 · d=4096 · FP16 · 8K 上下文单条请求 KV 缓存大小</text>

  <!-- Row 1: MHA -->
  <g>
    <rect x="52" y="134" width="428" height="86" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="64" y="155" class="row-tag" fill="#991b1b">MHA</text>
    <text x="104" y="155" class="row-sub" fill="#b91c1c">8Q : 8KV（一对一，无共享）</text>
    <rect x="344" y="140" width="126" height="21" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="407" y="154.5" class="cap-badge" fill="#991b1b">8K ≈ 4.0 GiB（1×）</text>

    <text x="64" y="177" class="blk-lbl" fill="#475569">Q</text>
    <text x="60" y="206" class="blk-lbl" fill="#991b1b">KV</text>
    <!-- 8 Q squares & 8 KV squares with 1:1 vertical links -->
    <g>
      <rect x="82"  y="165" width="21" height="14" rx="3" fill="#6366f1"/>
      <rect x="107" y="165" width="21" height="14" rx="3" fill="#6366f1"/>
      <rect x="132" y="165" width="21" height="14" rx="3" fill="#6366f1"/>
      <rect x="157" y="165" width="21" height="14" rx="3" fill="#6366f1"/>
      <rect x="182" y="165" width="21" height="14" rx="3" fill="#0284c7"/>
      <rect x="207" y="165" width="21" height="14" rx="3" fill="#0284c7"/>
      <rect x="232" y="165" width="21" height="14" rx="3" fill="#0284c7"/>
      <rect x="257" y="165" width="21" height="14" rx="3" fill="#0284c7"/>

      <line x1="92.5"  y1="179" x2="92.5"  y2="193" stroke="#f87171" stroke-width="1.3"/>
      <line x1="117.5" y1="179" x2="117.5" y2="193" stroke="#f87171" stroke-width="1.3"/>
      <line x1="142.5" y1="179" x2="142.5" y2="193" stroke="#f87171" stroke-width="1.3"/>
      <line x1="167.5" y1="179" x2="167.5" y2="193" stroke="#f87171" stroke-width="1.3"/>
      <line x1="192.5" y1="179" x2="192.5" y2="193" stroke="#f87171" stroke-width="1.3"/>
      <line x1="217.5" y1="179" x2="217.5" y2="193" stroke="#f87171" stroke-width="1.3"/>
      <line x1="242.5" y1="179" x2="242.5" y2="193" stroke="#f87171" stroke-width="1.3"/>
      <line x1="267.5" y1="179" x2="267.5" y2="193" stroke="#f87171" stroke-width="1.3"/>

      <rect x="82"  y="194" width="21" height="14" rx="3" fill="#dc2626"/>
      <rect x="107" y="194" width="21" height="14" rx="3" fill="#dc2626"/>
      <rect x="132" y="194" width="21" height="14" rx="3" fill="#dc2626"/>
      <rect x="157" y="194" width="21" height="14" rx="3" fill="#dc2626"/>
      <rect x="182" y="194" width="21" height="14" rx="3" fill="#ef4444"/>
      <rect x="207" y="194" width="21" height="14" rx="3" fill="#ef4444"/>
      <rect x="232" y="194" width="21" height="14" rx="3" fill="#ef4444"/>
      <rect x="257" y="194" width="21" height="14" rx="3" fill="#ef4444"/>
    </g>
    <text x="292" y="184" class="row-sub" fill="#7f1d1d">每头独存完整 K 与 V</text>
    <text x="292" y="203" class="row-sub" fill="#991b1b">长上下文显存与带宽压力最大</text>
  </g>

  <!-- Row 2: GQA -->
  <g>
    <rect x="52" y="230" width="428" height="86" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="64" y="251" class="row-tag" fill="#3730a3">GQA</text>
    <text x="104" y="251" class="row-sub" fill="#4f46e5">8Q : 2KV（分组共享，Llama-3）</text>
    <rect x="344" y="236" width="126" height="21" rx="5" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="407" y="250.5" class="cap-badge" fill="#3730a3">8K ≈ 1.0 GiB（¼×）</text>

    <text x="64" y="273" class="blk-lbl" fill="#475569">Q</text>
    <text x="60" y="303" class="blk-lbl" fill="#3730a3">KV</text>
    <!-- 8 Q squares converging 4:1 into 2 KV blocks -->
    <g>
      <rect x="82"  y="261" width="21" height="14" rx="3" fill="#6366f1"/>
      <rect x="107" y="261" width="21" height="14" rx="3" fill="#6366f1"/>
      <rect x="132" y="261" width="21" height="14" rx="3" fill="#6366f1"/>
      <rect x="157" y="261" width="21" height="14" rx="3" fill="#6366f1"/>
      <rect x="182" y="261" width="21" height="14" rx="3" fill="#0284c7"/>
      <rect x="207" y="261" width="21" height="14" rx="3" fill="#0284c7"/>
      <rect x="232" y="261" width="21" height="14" rx="3" fill="#0284c7"/>
      <rect x="257" y="261" width="21" height="14" rx="3" fill="#0284c7"/>

      <!-- Fan-in lines Group 0 -> center 130 -->
      <line x1="92.5"  y1="275" x2="122" y2="289" stroke="#6366f1" stroke-width="1.3"/>
      <line x1="117.5" y1="275" x2="127" y2="289" stroke="#6366f1" stroke-width="1.3"/>
      <line x1="142.5" y1="275" x2="133" y2="289" stroke="#6366f1" stroke-width="1.3"/>
      <line x1="167.5" y1="275" x2="138" y2="289" stroke="#6366f1" stroke-width="1.3"/>
      <!-- Fan-in lines Group 1 -> center 230 -->
      <line x1="192.5" y1="275" x2="222" y2="289" stroke="#0284c7" stroke-width="1.3"/>
      <line x1="217.5" y1="275" x2="227" y2="289" stroke="#0284c7" stroke-width="1.3"/>
      <line x1="242.5" y1="275" x2="233" y2="289" stroke="#0284c7" stroke-width="1.3"/>
      <line x1="267.5" y1="275" x2="238" y2="289" stroke="#0284c7" stroke-width="1.3"/>

      <rect x="104" y="289" width="52" height="18" rx="4" fill="#4f46e5"/>
      <text x="130" y="302" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">KV₀</text>
      <rect x="204" y="289" width="52" height="18" rx="4" fill="#0284c7"/>
      <text x="230" y="302" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">KV₁</text>
    </g>
    <text x="292" y="280" class="row-sub" fill="#312e81">4 个 Q 头共享 1 组 KV</text>
    <text x="292" y="299" class="row-sub" fill="#3730a3">KV 体积与搬运量直降 75%</text>
  </g>

  <!-- Row 3: MLA -->
  <g>
    <rect x="52" y="326" width="428" height="94" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="64" y="347" class="row-tag" fill="#065f46">MLA</text>
    <text x="104" y="347" class="row-sub" fill="#047857">低维潜变量（DeepSeek）</text>
    <rect x="330" y="332" width="140" height="21" rx="5" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="400" y="346.5" class="cap-badge" fill="#065f46">8K ≈ 0.28 GiB（≈1/14）</text>

    <text x="64" y="369" class="blk-lbl" fill="#475569">Q</text>
    <text x="64" y="403" class="blk-lbl" fill="#065f46">c</text>
    <!-- 8 Q squares converging to 1 compact latent vector c -->
    <g>
      <rect x="82"  y="357" width="21" height="14" rx="3" fill="#059669"/>
      <rect x="107" y="357" width="21" height="14" rx="3" fill="#059669"/>
      <rect x="132" y="357" width="21" height="14" rx="3" fill="#059669"/>
      <rect x="157" y="357" width="21" height="14" rx="3" fill="#059669"/>
      <rect x="182" y="357" width="21" height="14" rx="3" fill="#10b981"/>
      <rect x="207" y="357" width="21" height="14" rx="3" fill="#10b981"/>
      <rect x="232" y="357" width="21" height="14" rx="3" fill="#10b981"/>
      <rect x="257" y="357" width="21" height="14" rx="3" fill="#10b981"/>

      <line x1="92.5"  y1="371" x2="162" y2="388" stroke="#10b981" stroke-width="1.2"/>
      <line x1="117.5" y1="371" x2="168" y2="388" stroke="#10b981" stroke-width="1.2"/>
      <line x1="142.5" y1="371" x2="173" y2="388" stroke="#10b981" stroke-width="1.2"/>
      <line x1="167.5" y1="371" x2="178" y2="388" stroke="#10b981" stroke-width="1.2"/>
      <line x1="192.5" y1="371" x2="182" y2="388" stroke="#10b981" stroke-width="1.2"/>
      <line x1="217.5" y1="371" x2="187" y2="388" stroke="#10b981" stroke-width="1.2"/>
      <line x1="242.5" y1="371" x2="192" y2="388" stroke="#10b981" stroke-width="1.2"/>
      <line x1="267.5" y1="371" x2="198" y2="388" stroke="#10b981" stroke-width="1.2"/>

      <rect x="142" y="388" width="76" height="21" rx="5" fill="#059669"/>
      <text x="180" y="402.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">潜变量 c</text>
    </g>
    <text x="292" y="370" class="row-sub" fill="#064e3b">仅缓存 1 份低维潜向量 c</text>
    <text x="292" y="388" class="row-sub" fill="#065f46" font-weight="600">qU_kᵀ 矩阵吸收直接算分</text>
    <text x="292" y="406" class="row-sub" fill="#047857">无需还原完整 K/V 矩阵</text>
  </g>

  <!-- ==================== RIGHT PANEL: MoE SPARSE ROUTING ==================== -->
  <rect x="508" y="80" width="374" height="350" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="524" y="105" class="panel-title">MoE 稀疏专家路由（Top-2 / 8 专家）</text>
  <text x="524" y="123" class="panel-sub">单 Token 动态激活 2 个专家，其余 6 个跳过计算</text>

  <!-- Input token -->
  <rect x="615" y="135" width="160" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="695" y="153.5" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="middle">单个输入 Token x</text>

  <line x1="695" y1="163" x2="695" y2="177" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- Router Gate -->
  <rect x="578" y="179" width="234" height="32" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="695" y="200" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">Router 门控打分 → Top-2 路由</text>

  <!-- Routing paths to E2 (cx=587.5) & E6 (cx=759.5) -->
  <line x1="665" y1="211" x2="592" y2="250" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <line x1="725" y1="211" x2="756" y2="250" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text x="614" y="233" font-size="11" font-weight="700" fill="#b45309" class="mono" text-anchor="end">w₁=0.62</text>
  <text x="732" y="233" font-size="11" font-weight="700" fill="#b45309" class="mono" text-anchor="end">w₂=0.38</text>

  <!-- HBM full residency dashed container -->
  <rect x="518" y="244" width="354" height="58" rx="8" fill="#fffbeb" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="868" y="237" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="end">8 专家全驻留 HBM</text>

  <!-- 8 Expert boxes (x=526 + i*43, w=37, h=42, y=252) -->
  <g>
    <!-- E1 inactive -->
    <rect x="526" y="252" width="37" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="544.5" y="270" class="exp-t" fill="#94a3b8">E1</text>
    <text x="544.5" y="285" class="exp-s" fill="#94a3b8">休眠</text>
    <!-- E2 ACTIVE -->
    <rect x="569" y="252" width="37" height="42" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="587.5" y="270" class="exp-t" fill="#92400e">E2</text>
    <text x="587.5" y="285" class="exp-s" fill="#b45309" font-weight="700">激活</text>
    <!-- E3 inactive -->
    <rect x="612" y="252" width="37" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="630.5" y="270" class="exp-t" fill="#94a3b8">E3</text>
    <text x="630.5" y="285" class="exp-s" fill="#94a3b8">休眠</text>
    <!-- E4 inactive -->
    <rect x="655" y="252" width="37" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="673.5" y="270" class="exp-t" fill="#94a3b8">E4</text>
    <text x="673.5" y="285" class="exp-s" fill="#94a3b8">休眠</text>
    <!-- E5 inactive -->
    <rect x="698" y="252" width="37" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="716.5" y="270" class="exp-t" fill="#94a3b8">E5</text>
    <text x="716.5" y="285" class="exp-s" fill="#94a3b8">休眠</text>
    <!-- E6 ACTIVE -->
    <rect x="741" y="252" width="37" height="42" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="759.5" y="270" class="exp-t" fill="#92400e">E6</text>
    <text x="759.5" y="285" class="exp-s" fill="#b45309" font-weight="700">激活</text>
    <!-- E7 inactive -->
    <rect x="784" y="252" width="37" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="802.5" y="270" class="exp-t" fill="#94a3b8">E7</text>
    <text x="802.5" y="285" class="exp-s" fill="#94a3b8">休眠</text>
    <!-- E8 inactive -->
    <rect x="827" y="252" width="37" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="845.5" y="270" class="exp-t" fill="#94a3b8">E8</text>
    <text x="845.5" y="285" class="exp-s" fill="#94a3b8">休眠</text>
  </g>

  <!-- Merge arrows from E2 & E6 to output -->
  <line x1="587.5" y1="294" x2="660" y2="315" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
  <line x1="759.5" y1="294" x2="730" y2="315" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>

  <rect x="598" y="317" width="194" height="28" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="695" y="335.5" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">加权输出 y = w₁E2(x) + w₂E6(x)</text>

  <!-- Key Contrast Card -->
  <rect x="520" y="355" width="350" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="695" y1="363" x2="695" y2="412" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <!-- Left half: Memory -->
  <text x="532" y="375" font-size="12.5" font-weight="700" fill="#b45309">显存账本：看总参数</text>
  <text x="532" y="393" font-size="11.5" fill="#78350f">• 8/8 专家全驻留 HBM</text>
  <text x="532" y="409" font-size="11.5" fill="#78350f">• 容量吃紧，常需多卡 EP</text>
  <!-- Right half: Compute -->
  <text x="706" y="375" font-size="12.5" font-weight="700" fill="#047857">算力账本：看激活参数</text>
  <text x="706" y="393" font-size="11.5" fill="#065f46">• 单 Token 只算一小撮</text>
  <text x="706" y="409" font-size="11.5" fill="#065f46">• 算术强度更低，更吃带宽</text>

  <!-- Bottom takeaway -->
  <rect x="38" y="440" width="844" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="457" class="note"><tspan font-weight="700" fill="#1e293b">账本启示：</tspan>GQA/MLA 压缩 KV 换取更大并发与长上下文；MoE 用总显存换单步低算力，但批越大越易同时唤醒全部专家。</text>
</svg>
