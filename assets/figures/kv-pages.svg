<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="PagedAttention 逻辑块到物理页的映射">
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.title{font-size:22px;font-weight:700;fill:#1f2937}.sub{font-size:14px;fill:#6b7280}
.label{font-size:15px;font-weight:700;fill:#1f2937}.small{font-size:12px;fill:#6b7280}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="900" height="420" fill="#fbfcfe"/>
<text x="40" y="42" class="title">PagedAttention：逻辑块 → 块表 → 物理页</text>
<text x="40" y="64" class="sub">序列在逻辑上连续，在显存里可以分散到任意空闲页；块表负责翻译。</text>
<text x="70" y="100" class="small">逻辑块（sequence）</text>
<g>
<rect x="70" y="112" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="105" y="139" class="small" text-anchor="middle">L0</text>
<rect x="150" y="112" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="185" y="139" class="small" text-anchor="middle">L1</text>
<rect x="230" y="112" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="265" y="139" class="small" text-anchor="middle">L2</text>
<rect x="310" y="112" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="345" y="139" class="small" text-anchor="middle">L3</text>
<rect x="390" y="112" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="425" y="139" class="small" text-anchor="middle">L4</text>
<rect x="470" y="112" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="505" y="139" class="small" text-anchor="middle">L5</text>
</g>
<line x1="265" y1="158" x2="265" y2="190" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="70" y="195" width="300" height="105" rx="8" fill="#fff" stroke="#dbe3ef"/>
<text x="86" y="220" class="label">块表</text>
<text x="86" y="244" class="small">L0 → P7　L1 → P2</text>
<text x="86" y="264" class="small">L2 → P5　L3 → P7</text>
<text x="86" y="284" class="small">L4 → P1　L5 → P4</text>
<text x="430" y="188" class="small">物理页（显存）</text>
<g>
<rect x="430" y="200" width="70" height="44" rx="6" fill="#fff" stroke="#dbe3ef"/><text x="465" y="227" class="small" text-anchor="middle">P0</text>
<rect x="510" y="200" width="70" height="44" rx="6" fill="#d1fae5" stroke="#a7f3d0"/><text x="545" y="227" class="small" text-anchor="middle">P1</text>
<rect x="590" y="200" width="70" height="44" rx="6" fill="#fee2e2" stroke="#fecaca"/><text x="625" y="227" class="small" text-anchor="middle">P2</text>
<rect x="670" y="200" width="70" height="44" rx="6" fill="#fff" stroke="#dbe3ef"/><text x="705" y="227" class="small" text-anchor="middle">P3</text>
<rect x="750" y="200" width="70" height="44" rx="6" fill="#d1fae5" stroke="#a7f3d0"/><text x="785" y="227" class="small" text-anchor="middle">P4</text>
<rect x="430" y="255" width="70" height="44" rx="6" fill="#fef3c7" stroke="#fde68a"/><text x="465" y="282" class="small" text-anchor="middle">P5</text>
<rect x="510" y="255" width="70" height="44" rx="6" fill="#fff" stroke="#dbe3ef"/><text x="545" y="282" class="small" text-anchor="middle">P6</text>
<rect x="590" y="255" width="70" height="44" rx="6" fill="#dbeafe" stroke="#bfdbfe"/><text x="625" y="282" class="small" text-anchor="middle">P7</text>
<rect x="670" y="255" width="70" height="44" rx="6" fill="#fff" stroke="#dbe3ef"/><text x="705" y="282" class="small" text-anchor="middle">P8</text>
<rect x="750" y="255" width="70" height="44" rx="6" fill="#fff" stroke="#dbe3ef"/><text x="785" y="282" class="small" text-anchor="middle">P9</text>
</g>
<line x1="375" y1="245" x2="424" y2="245" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="70" y="350" class="label">省显存的关键</text>
<text x="200" y="350" class="small">只浪费最后一个未满页，不再按最大长度预留连续 KV。</text>
<text x="70" y="376" class="small">代价：attention kernel 要按块表 gather；块大小与碎片率要调。</text>
<text x="430" y="336" class="small">块表是每请求一份的小数组；物理页按需分配、释放、复用。</text>
</svg>