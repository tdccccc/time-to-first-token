<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="PagedAttention 逻辑块到物理页的映射">
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.title{font-size:25px;font-weight:700;fill:#1f2937}
.sub{font-size:15px;fill:#64748b}
.label{font-size:16px;font-weight:600;fill:#1f2937}
.small{font-size:14px;fill:#64748b}
.note{font-size:14px;fill:#334155}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="900" height="430" fill="#fbfcfe"/>
<text x="40" y="40" class="title">PagedAttention：逻辑块 → 块表 → 物理页</text>
<text x="40" y="64" class="sub">序列在逻辑上连续，在显存里可以分散到任意空闲页；块表负责翻译。</text>

<text x="70" y="104" class="small">逻辑块（按请求连续）</text>
<g>
<rect x="70" y="116" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="105" y="143" class="small" text-anchor="middle">L0</text>
<rect x="150" y="116" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="185" y="143" class="small" text-anchor="middle">L1</text>
<rect x="230" y="116" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="265" y="143" class="small" text-anchor="middle">L2</text>
<rect x="310" y="116" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="345" y="143" class="small" text-anchor="middle">L3</text>
<rect x="390" y="116" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="425" y="143" class="small" text-anchor="middle">L4</text>
<rect x="470" y="116" width="70" height="44" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/><text x="505" y="143" class="small" text-anchor="middle">L5</text>
</g>
<line x1="270" y1="162" x2="270" y2="192" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="70" y="198" width="340" height="122" rx="8" fill="#ffffff" stroke="#dbe3ef"/>
<text x="86" y="224" class="label">块表（每请求一份）</text>
<text x="86" y="250" class="small">L0 → P7　　L1 → P2</text>
<text x="86" y="272" class="small">L2 → P5　　L3 → P0</text>
<text x="86" y="294" class="small">L4 → P1　　L5 → P4</text>

<text x="570" y="180" class="small">物理页（显存）</text>
<g>
<rect x="570" y="200" width="52" height="44" rx="5" fill="#dbeafe" stroke="#bfdbfe"/><text x="596" y="227" class="small" text-anchor="middle">P0</text>
<rect x="628" y="200" width="52" height="44" rx="5" fill="#d1fae5" stroke="#a7f3d0"/><text x="654" y="227" class="small" text-anchor="middle">P1</text>
<rect x="686" y="200" width="52" height="44" rx="5" fill="#fee2e2" stroke="#fecaca"/><text x="712" y="227" class="small" text-anchor="middle">P2</text>
<rect x="744" y="200" width="52" height="44" rx="5" fill="#ffffff" stroke="#e2e8f0"/><text x="770" y="227" class="small" text-anchor="middle">P3</text>
<rect x="802" y="200" width="52" height="44" rx="5" fill="#d1fae5" stroke="#a7f3d0"/><text x="828" y="227" class="small" text-anchor="middle">P4</text>
<rect x="570" y="252" width="52" height="44" rx="5" fill="#fef3c7" stroke="#fde68a"/><text x="596" y="279" class="small" text-anchor="middle">P5</text>
<rect x="628" y="252" width="52" height="44" rx="5" fill="#ffffff" stroke="#e2e8f0"/><text x="654" y="279" class="small" text-anchor="middle">P6</text>
<rect x="686" y="252" width="52" height="44" rx="5" fill="#dbeafe" stroke="#bfdbfe"/><text x="712" y="279" class="small" text-anchor="middle">P7</text>
<rect x="744" y="252" width="52" height="44" rx="5" fill="#ffffff" stroke="#e2e8f0"/><text x="770" y="279" class="small" text-anchor="middle">P8</text>
<rect x="802" y="252" width="52" height="44" rx="5" fill="#ffffff" stroke="#e2e8f0"/><text x="828" y="279" class="small" text-anchor="middle">P9</text>
</g>
<line x1="414" y1="258" x2="566" y2="258" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="70" y="356" class="note">省显存：只浪费最后一个未满页，不再按最大长度预留连续 KV。</text>
<text x="70" y="380" class="note">代价：attention kernel 要按块表 gather；块大小与碎片率要调。</text>
<text x="70" y="404" class="note">块表是每请求一份的小数组；物理页按需分配、释放、复用。</text>
</svg>
