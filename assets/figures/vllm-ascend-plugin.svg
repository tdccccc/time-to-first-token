<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-label="vllm-ascend 平台插件架构（6 大核心模块与 TorchNPU/CANN 衔接）及三层自下而上诊断漏斗">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 23px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 14px; fill: #64748b; }
    .sec { font-size: 14px; font-weight: 700; fill: #1e293b; }
    .layer-t { font-size: 13px; font-weight: 700; }
    .mod-t { font-size: 11.5px; font-weight: 700; fill: #047857; }
    .mod-s { font-size: 10.5px; fill: #475569; }
    .pill { font-size: 10.5px; font-weight: 700; }
    .diag-t { font-size: 13px; font-weight: 700; }
    .diag-s { font-size: 11px; fill: #334155; }
    .diag-warn { font-size: 10.5px; fill: #b45309; }
    .note { font-size: 12.5px; fill: #334155; }
  </style>
  <defs>
    <marker id="arr-down" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-up-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-up-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="920" height="460" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="36" y="38" class="title">vllm-ascend 插件架构与三层自下而上诊断</text>
  <text x="36" y="61" class="sub">左图展示 Out-of-Tree 插件如何解耦主干与昇腾适配；右图按“驱动 → 框架 → 插件”由底向上排查环境。</text>

  <!-- Vertical divider -->
  <line x1="530" y1="78" x2="530" y2="416" stroke="#e2e8f0" stroke-width="1.3"/>

  <!-- ==================== Left Half: vllm-ascend Plugin Architecture ==================== -->
  <text x="36" y="92" class="sec">vllm-ascend 平台插件架构</text>

  <!-- Layer 1: vLLM Core -->
  <rect x="36" y="102" width="478" height="64" rx="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.3"/>
  <text x="52" y="123" class="layer-t" fill="#3f51b5">vLLM 通用主干</text>
  <rect x="156" y="109" width="204" height="19" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="258" y="122" class="pill" fill="#3f51b5" text-anchor="middle">芯片无关 · Hardware-Agnostic</text>

  <rect x="52" y="133" width="142" height="25" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="123" y="150" class="mod-s" fill="#1e293b" text-anchor="middle">模型代码（Models）</text>
  <rect x="204" y="133" width="142" height="25" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="275" y="150" class="mod-s" fill="#1e293b" text-anchor="middle">调度器（Scheduler）</text>
  <rect x="356" y="133" width="142" height="25" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="427" y="150" class="mod-s" fill="#1e293b" text-anchor="middle">KV 管理（PagedKV）</text>

  <!-- Platform Plugin Hook Connector -->
  <line x1="275" y1="166" x2="275" y2="195" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-down)"/>
  <rect x="118" y="171" width="314" height="20" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="275" y="185" class="pill" fill="#b45309" text-anchor="middle">Platform Plugin 钩子（vllm.platform_plugins）</text>

  <!-- Layer 2: vllm-ascend (6 core modules) -->
  <rect x="36" y="198" width="478" height="118" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="52" y="218" class="layer-t" fill="#047857">vllm-ascend 插件（6 大核心模块）</text>

  <!-- Row 1 of 6 modules -->
  <rect x="50" y="227" width="144" height="37" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="122" y="243" class="mono mod-t" text-anchor="middle">platform.py</text>
  <text x="122" y="258" class="mod-s" text-anchor="middle">设备探测与配置钩子</text>

  <rect x="204" y="227" width="144" height="37" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="276" y="243" class="mono mod-t" text-anchor="middle">ops/</text>
  <text x="276" y="258" class="mod-s" text-anchor="middle">CustomOp 算子覆写</text>

  <rect x="358" y="227" width="144" height="37" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="430" y="243" class="mono mod-t" text-anchor="middle">attention/</text>
  <text x="430" y="258" class="mod-s" text-anchor="middle">PagedAttn / MLA 后端</text>

  <!-- Row 2 of 6 modules -->
  <rect x="50" y="271" width="144" height="37" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="122" y="287" class="mono mod-t" text-anchor="middle">quantization/</text>
  <text x="122" y="302" class="mod-s" text-anchor="middle">W8A8 / W4A8 量化</text>

  <rect x="204" y="271" width="144" height="37" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="276" y="287" class="mono mod-t" text-anchor="middle">distributed/</text>
  <text x="276" y="302" class="mod-s" text-anchor="middle">HCCL 集合通信适配</text>

  <rect x="358" y="271" width="144" height="37" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="430" y="287" class="mono mod-t" text-anchor="middle">compilation/</text>
  <text x="430" y="302" class="mod-s" text-anchor="middle">ACLGraph / 图编译</text>

  <line x1="275" y1="316" x2="275" y2="328" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-down)"/>

  <!-- Layer 3: TorchNPU -->
  <rect x="36" y="330" width="478" height="36" rx="7" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="52" y="353" class="layer-t" fill="#0369a1">TorchNPU（torch_npu）</text>
  <text x="498" y="353" class="mod-s" text-anchor="end">PyTorch PrivateUse1 扩展 · op_plugin</text>

  <line x1="275" y1="366" x2="275" y2="378" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-down)"/>

  <!-- Layer 4: CANN & NPU -->
  <rect x="36" y="380" width="478" height="36" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="52" y="403" class="layer-t" fill="#1e293b">CANN 与昇腾 NPU</text>
  <text x="498" y="403" class="mod-s" text-anchor="end">AscendCL · aclnn · HCCL · 驱动/固件</text>

  <!-- ==================== Right Half: Bottom-Up 3-Layer Diagnostic Funnel ==================== -->
  <text x="546" y="92" class="sec">三层自下而上诊断漏斗（从底往上查）</text>

  <!-- Tier 3 (Top, narrowest): Plugin Activation -->
  <rect x="576" y="106" width="278" height="82" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="590" y="126" class="diag-t" fill="#047857">第 3 层 · 插件激活</text>
  <rect x="772" y="112" width="70" height="18" rx="4" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="807" y="125" class="pill" fill="#047857" text-anchor="middle">vLLM 日志</text>
  <text x="590" y="146" class="diag-s">检查启动日志是否打印激活标记：</text>
  <rect x="590" y="154" width="250" height="24" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="715" y="170" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Platform plugin ascend is activated</text>

  <!-- Upward arrow 2 -> 3 -->
  <line x1="715" y1="214" x2="715" y2="191" stroke="#059669" stroke-width="2" marker-end="url(#arr-up-green)"/>
  <text x="728" y="207" class="pill" fill="#047857">框架就绪，验插件 ↑</text>

  <!-- Tier 2 (Middle): Framework Adapter -->
  <rect x="561" y="216" width="308" height="82" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="575" y="236" class="diag-t" fill="#0369a1">第 2 层 · 框架适配</text>
  <rect x="777" y="222" width="78" height="18" rx="4" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="816" y="235" class="mono pill" fill="#0369a1" text-anchor="middle">torch.npu</text>
  <text x="575" y="258" class="mono" font-size="11" font-weight="700" fill="#1e293b">torch.npu.is_available() == True</text>
  <text x="575" y="280" class="diag-s" fill="#b91c1c">失败多因 PyTorch / torch_npu / CANN 版本错配</text>

  <!-- Upward arrow 1 -> 2 -->
  <line x1="715" y1="324" x2="715" y2="301" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-up-blue)"/>
  <text x="728" y="317" class="pill" fill="#0284c7">驱动正常，查框架 ↑</text>

  <!-- Tier 1 (Bottom, widest base): Driver / Firmware -->
  <rect x="546" y="326" width="338" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="560" y="347" class="diag-t" fill="#b45309">第 1 层 · 驱动与固件（排查起点）</text>
  <rect x="804" y="333" width="68" height="18" rx="4" fill="#ffffff" stroke="#fcd34d"/>
  <text x="838" y="346" class="mono pill" fill="#b45309" text-anchor="middle">npu-smi</text>
  <text x="560" y="369" class="mono" font-size="11.5" font-weight="700" fill="#1e293b">npu-smi info</text>
  <text x="656" y="369" class="diag-s">确认卡号、健康状态与 HBM 可见</text>
  <text x="560" y="390" class="diag-warn">底层未通切勿追查上层报错：先查驱动、固件与容器设备挂载</text>
  <text x="560" y="406" class="mod-s">重点检查 /dev/davinci* 设备映射与 CANN 环境变量</text>

  <!-- Bottom takeaway -->
  <text x="36" y="438" class="note">排查纪律：逐层绿灯放行（npu-smi → torch.npu → 插件日志）；任何一层红灯即停止向上排查，先修本层依赖。</text>
</svg>
