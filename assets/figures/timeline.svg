<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="一次流式请求的时间线：排队、prefill、TTFT 与 ITL">
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.title{font-size:25px;font-weight:700;fill:#1f2937}
.sub{font-size:15px;fill:#64748b}
.label{font-size:18px;font-weight:600;fill:#1f2937}
.small{font-size:14px;fill:#64748b}
.tick{font-size:13px;fill:#64748b}
</style>
<rect width="900" height="430" fill="#fbfcfe"/>
<text x="40" y="40" class="title">一次请求的时间账</text>
<text x="40" y="64" class="sub">TTFT 从请求发出算到第一个 token；ITL 量 decode 阶段相邻 token 的间隔。</text>

<text x="90" y="128" class="small">请求到达</text>
<text x="365" y="128" class="small" text-anchor="end">首 token</text>
<text x="790" y="128" class="small" text-anchor="end">请求结束</text>

<rect x="90" y="150" width="95" height="56" rx="6" fill="#e2e8f0"/>
<text x="137.5" y="184" class="label" text-anchor="middle" fill="#64748b">排队</text>
<rect x="185" y="150" width="175" height="56" rx="6" fill="#3f51b5"/>
<text x="272.5" y="184" class="label" text-anchor="middle" fill="#ffffff">prefill</text>

<text x="557" y="142" class="small" text-anchor="middle" fill="#3f51b5">decode / 逐 token</text>
<g>
<rect x="370" y="150" width="45" height="56" rx="5" fill="#0f9f6e"/>
<rect x="425" y="150" width="45" height="56" rx="5" fill="#3f51b5"/>
<rect x="480" y="150" width="45" height="56" rx="5" fill="#3f51b5"/>
<rect x="535" y="150" width="45" height="56" rx="5" fill="#3f51b5"/>
<rect x="590" y="150" width="45" height="56" rx="5" fill="#3f51b5"/>
<rect x="645" y="150" width="45" height="56" rx="5" fill="#3f51b5"/>
<rect x="700" y="150" width="45" height="56" rx="5" fill="#3f51b5"/>
</g>
<g class="small" fill="#ffffff" text-anchor="middle" style="font-size:14px">
<text x="392.5" y="184">1</text>
<text x="447.5" y="184">2</text>
<text x="502.5" y="184">3</text>
<text x="557.5" y="184">4</text>
<text x="612.5" y="184">5</text>
<text x="667.5" y="184">6</text>
<text x="722.5" y="184">7</text>
</g>

<line x1="90" y1="238" x2="365" y2="238" stroke="#f59e0b" stroke-width="3"/>
<polygon points="365,238 354,232 354,244" fill="#f59e0b"/>
<line x1="90" y1="232" x2="90" y2="244" stroke="#f59e0b" stroke-width="3"/>
<text x="227" y="262" class="label" text-anchor="middle" fill="#b45309">TTFT（排队 + prefill + 首 token）</text>

<line x1="370" y1="290" x2="745" y2="290" stroke="#0f9f6e" stroke-width="2"/>
<line x1="370" y1="284" x2="370" y2="296" stroke="#0f9f6e" stroke-width="2"/>
<line x1="745" y1="284" x2="745" y2="296" stroke="#0f9f6e" stroke-width="2"/>
<text x="557" y="312" class="label" text-anchor="middle" fill="#0f9f6e">ITL：相邻 token 的间隔</text>

<line x1="90" y1="342" x2="840" y2="342" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="846,342 836,337 836,347" fill="#94a3b8"/>
<text x="840" y="364" class="small" text-anchor="end">时间 →</text>
<text x="90" y="398" class="small">示意：排队与 prefill 都计入 TTFT；优化 ITL 要看 decode 的 batch、KV 读取与调度。</text>
</svg>
