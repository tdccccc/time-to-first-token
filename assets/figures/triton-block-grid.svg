<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-label="Triton 编程模型图解：上半展示长度 N=10000、BLOCK=1024 的 10 个 1D Program 并行切分，以及 pid=9 前 784 槽有效、后 240 槽被 mask=offs&lt;N 安全拦截；下半展示列向量 offs_m[:, None]*stride_am 与行向量 offs_k[None, :]*stride_ak 广播相加生成 2D 内存地址网格">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 23px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 14px; fill: #64748b; }
    .h2 { font-size: 13.5px; font-weight: 700; fill: #1e293b; }
    .h3 { font-size: 11.5px; font-weight: 700; }
    .body { font-size: 11.5px; fill: #334155; }
    .tiny { font-size: 10.5px; fill: #64748b; }
    .pill { font-size: 11px; font-weight: 700; }
    .cell { font-size: 10px; font-weight: 600; }
    .note { font-size: 13px; fill: #475569; }
  </style>

  <!-- Background -->
  <rect width="920" height="470" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="36" y="38" class="title">Triton 编程模型：1D Block 尾部掩码与 2D 广播指针网格</text>
  <text x="36" y="62" class="sub">上：按 Program (pid) 切分 1D 数据并用 mask 防尾块越界；下：通过 1D 步长向量广播构造 2D 矩阵块指针。</text>

  <!-- ==================== UPPER PANEL: 1D BLOCK + MASK ==================== -->
  <rect x="36" y="76" width="848" height="164" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.3"/>
  <rect x="52" y="88" width="122" height="22" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="113" y="103" class="pill" fill="#3f51b5" text-anchor="middle">1D Block 与 mask</text>
  <text x="184" y="104" class="body" fill="#475569">
    长度 <tspan class="mono" fill="#1e293b" style="font-weight:700">N = 10,000</tspan> · <tspan class="mono" fill="#1e293b" style="font-weight:700">BLOCK = 1024</tspan> · <tspan class="mono" fill="#3f51b5" style="font-weight:700">grid = (cdiv(N, BLOCK),) = (10,)</tspan>（共 10,240 槽）
  </text>

  <!-- 10 Program Blocks Strip (x=54..864, each w=76, gap=5.5) -->
  <g class="mono" style="font-size:11px;font-weight:700" text-anchor="middle">
    <rect x="54"    y="120" width="76" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="92"    y="141" fill="#312e81">pid=0</text>
    <rect x="135.5" y="120" width="76" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="173.5" y="141" fill="#312e81">pid=1</text>
    <rect x="217"   y="120" width="76" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="255"   y="141" fill="#312e81">pid=2</text>
    <rect x="298.5" y="120" width="76" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="336.5" y="141" fill="#312e81">pid=3</text>
    <rect x="380"   y="120" width="76" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="418"   y="141" fill="#312e81">pid=4</text>
    <rect x="461.5" y="120" width="76" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="499.5" y="141" fill="#312e81">pid=5</text>
    <rect x="543"   y="120" width="76" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="581"   y="141" fill="#312e81">pid=6</text>
    <rect x="624.5" y="120" width="76" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="662.5" y="141" fill="#312e81">pid=7</text>
    <rect x="706"   y="120" width="76" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="744"   y="141" fill="#312e81">pid=8</text>

    <!-- pid=9 Split Block: 784 valid (58px) + 240 masked (18px) -->
    <rect x="787.5" y="120" width="58" height="34" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="845.5" y="120" width="18" height="34" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3,2"/>
    <text x="816.5" y="141" fill="#065f46">pid=9</text>
  </g>

  <!-- Boundary marker at N = 10000 -->
  <line x1="845.5" y1="114" x2="845.5" y2="159" stroke="#dc2626" stroke-width="1.8"/>
  <text x="845.5" y="111" class="tiny mono" fill="#dc2626" text-anchor="middle" style="font-weight:700">N=10000</text>

  <!-- Index range annotations under strip -->
  <text x="92"  y="167" class="tiny mono" text-anchor="middle">0..1023</text>
  <text x="744" y="167" class="tiny mono" text-anchor="middle">8192..9215</text>

  <!-- Zoom connector lines from pid=9 down to zoomed box -->
  <line x1="787.5" y1="154" x2="466" y2="176" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="863.5" y1="154" x2="864" y2="176" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Left Code Snippet Box -->
  <rect x="54" y="176" width="392" height="52" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="66" y="196" class="mono" style="font-size:11px;fill:#1e293b;font-weight:600">offs = tl.program_id(0) * BLOCK + tl.arange(0, BLOCK)</text>
  <text x="66" y="216" class="mono" style="font-size:11px;fill:#3f51b5;font-weight:700">mask = offs &lt; N  <tspan fill="#059669" style="font-weight:500"># 越界槽位不访存，other=0.0</tspan></text>

  <!-- Right Zoomed pid=9 Detail Box -->
  <rect x="464" y="176" width="400" height="52" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <!-- Valid 784 slots -->
  <rect x="476" y="184" width="286" height="24" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="619" y="200" class="tiny" fill="#047857" text-anchor="middle" style="font-weight:700">前 784 槽有效 [9216..9999] · mask = True</text>
  <!-- Masked 240 slots -->
  <rect x="764" y="184" width="88" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3,2"/>
  <text x="808" y="200" class="tiny" fill="#dc2626" text-anchor="middle" style="font-weight:700">后 240 槽拦截</text>
  <text x="664" y="222" class="tiny" fill="#475569" text-anchor="middle">pid=9 尾部 [10000..10239] 置 mask=False 安全跳过，杜绝越界读写</text>

  <!-- ==================== LOWER PANEL: 2D BROADCAST POINTER GRID ==================== -->
  <rect x="36" y="252" width="848" height="176" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="52" y="264" width="142" height="22" rx="11" fill="#e0f2fe" stroke="#bae6fd"/>
  <text x="123" y="279" class="pill" fill="#0284c7" text-anchor="middle">2D GEMM 广播指针网格</text>
  <text x="204" y="280" class="mono" style="font-size:11.5px;fill:#1e293b;font-weight:700">
    a_ptrs = A_ptr + <tspan fill="#3f51b5">offs_m[:, None] * stride_am</tspan> + <tspan fill="#0284c7">offs_k[None, :] * stride_ak</tspan>
  </text>

  <!-- 1. Column Vector [BLOCK_M, 1] -->
  <text x="115" y="306" class="h3" fill="#3f51b5" text-anchor="middle">列向量 [BM, 1]</text>
  <g class="cell mono" text-anchor="middle">
    <rect x="64" y="314" width="102" height="20" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="115" y="328" fill="#312e81">m0 · stride_am</text>
    <rect x="64" y="337" width="102" height="20" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="115" y="351" fill="#312e81">m1 · stride_am</text>
    <rect x="64" y="360" width="102" height="20" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="115" y="374" fill="#312e81">m2 · stride_am</text>
    <rect x="64" y="383" width="102" height="20" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="115" y="397" fill="#312e81">m3 · stride_am</text>
  </g>
  <text x="115" y="418" class="tiny" fill="#4338ca" text-anchor="middle">横向广播复制 →</text>

  <!-- Plus sign -->
  <text x="188" y="366" style="font-size:22px;font-weight:700;fill:#64748b" text-anchor="middle">+</text>

  <!-- 2. Row Vector [1, BLOCK_K] -->
  <text x="334" y="306" class="h3" fill="#0284c7" text-anchor="middle">行向量 [1, BK]</text>
  <g class="cell mono" text-anchor="middle">
    <rect x="210" y="346" width="59" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7"/><text x="239.5" y="362" fill="#0c4a6e">k0·s_ak</text>
    <rect x="273" y="346" width="59" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7"/><text x="302.5" y="362" fill="#0c4a6e">k1·s_ak</text>
    <rect x="336" y="346" width="59" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7"/><text x="365.5" y="362" fill="#0c4a6e">k2·s_ak</text>
    <rect x="399" y="346" width="59" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7"/><text x="428.5" y="362" fill="#0c4a6e">k3·s_ak</text>
  </g>
  <text x="334" y="390" class="tiny" fill="#0369a1" text-anchor="middle">↓ 纵向广播复制（叠加基址 A_ptr）</text>
  <text x="334" y="416" class="tiny mono" fill="#475569" text-anchor="middle">K 维循环步进：a_ptrs += BLOCK_K * stride_ak</text>

  <!-- Equals sign -->
  <text x="480" y="366" style="font-size:22px;font-weight:700;fill:#64748b" text-anchor="middle">=</text>

  <!-- 3. Broadcasted 2D Address Grid [BLOCK_M, BLOCK_K] -->
  <text x="684" y="306" class="h3" fill="#047857" text-anchor="middle">2D 内存地址网格 [BLOCK_M, BLOCK_K]</text>
  <g class="cell mono" text-anchor="middle" style="font-size:9.5px">
    <!-- Row 0 -->
    <rect x="502" y="314" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="546" y="328" fill="#065f46">m0·sm + k0·sk</text>
    <rect x="593" y="314" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="637" y="328" fill="#065f46">m0·sm + k1·sk</text>
    <rect x="684" y="314" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="728" y="328" fill="#065f46">m0·sm + k2·sk</text>
    <rect x="775" y="314" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="819" y="328" fill="#065f46">m0·sm + k3·sk</text>

    <!-- Row 1 -->
    <rect x="502" y="337" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="546" y="351" fill="#065f46">m1·sm + k0·sk</text>
    <rect x="593" y="337" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="637" y="351" fill="#065f46">m1·sm + k1·sk</text>
    <rect x="684" y="337" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="728" y="351" fill="#065f46">m1·sm + k2·sk</text>
    <rect x="775" y="337" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="819" y="351" fill="#065f46">m1·sm + k3·sk</text>

    <!-- Row 2 -->
    <rect x="502" y="360" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="546" y="374" fill="#065f46">m2·sm + k0·sk</text>
    <rect x="593" y="360" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="637" y="374" fill="#065f46">m2·sm + k1·sk</text>
    <rect x="684" y="360" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="728" y="374" fill="#065f46">m2·sm + k2·sk</text>
    <rect x="775" y="360" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="819" y="374" fill="#065f46">m2·sm + k3·sk</text>

    <!-- Row 3 -->
    <rect x="502" y="383" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="546" y="397" fill="#065f46">m3·sm + k0·sk</text>
    <rect x="593" y="383" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="637" y="397" fill="#065f46">m3·sm + k1·sk</text>
    <rect x="684" y="383" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="728" y="397" fill="#065f46">m3·sm + k2·sk</text>
    <rect x="775" y="383" width="88" height="20" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="819" y="397" fill="#065f46">m3·sm + k3·sk</text>
  </g>
  <text x="684" y="418" class="tiny" fill="#047857" text-anchor="middle" style="font-weight:600">单次 tl.load(a_ptrs, mask=...) 即可将整块二维 tile 合并载入片上</text>

  <!-- Bottom Takeaway Note -->
  <text x="36" y="448" class="note">要点：Triton 以块级 Program 隐藏线程同步细节，配合广播地址网格与 mask 即可安全高效地完成任意维度矩阵分块加载。</text>
</svg>
