<rect width="900" height="430" fill="#fbfcfe"/>
<text x="40" y="40" class="title">吞吐—延迟曲线：拐点比峰值更有用</text>
<text x="40" y="64" class="sub">算例（与 11.4 表一致）：吞吐先涨后平，p95 在拐点后陡增；并发档位等距，1→8 已压缩。</text>

