<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="吞吐与 p95 延迟随并发变化的示意曲线">
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.title{font-size:26px;font-weight:700;fill:#1f2937}.sub{font-size:16px;fill:#6b7280}
.label{font-size:16px;font-weight:700;fill:#1f2937}.small{font-size:14px;fill:#4b5563}
.tick{font-size:13px;fill:#6b7280}.note{font-size:14px;fill:#6b7280}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="900" height="430" fill="#fbfcfe"/>
<text x="40" y="42" class="title">吞吐—延迟曲线：拐点比峰值更有用</text>
<text x="40" y="64" class="sub">并发继续增加时，吞吐先放缓、p95 再陡增；两个信号要一起看。</text>

<text x="40" y="101" class="label">吞吐（请求/秒）</text>
<line x1="90" y1="115" x2="90" y2="218" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="90" y1="218" x2="840" y2="218" stroke="#94a3b8" stroke-width="1.2"/>
<text x="78" y="220" class="tick" text-anchor="end">0</text>
<text x="78" y="171" class="tick" text-anchor="end">25</text>
<text x="78" y="123" class="tick" text-anchor="end">50</text>
<polyline points="110,213 410,184 510,156 610,140 710,132 810,130" fill="none" stroke="#3f51b5" stroke-width="3"/>
<circle cx="110" cy="213" r="4" fill="#3f51b5"/><circle cx="410" cy="184" r="4" fill="#3f51b5"/><circle cx="510" cy="156" r="4" fill="#3f51b5"/><circle cx="610" cy="140" r="4" fill="#3f51b5"/><circle cx="710" cy="132" r="4" fill="#3f51b5"/><circle cx="810" cy="130" r="4" fill="#3f51b5"/>
<text x="420" y="173" class="small">吞吐增长变慢</text>
<text x="700" y="122" class="small" fill="#b45309">接近平台</text>

<text x="40" y="266" class="label">p95 延迟（毫秒）</text>
<line x1="90" y1="280" x2="90" y2="383" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="90" y1="383" x2="840" y2="383" stroke="#94a3b8" stroke-width="1.2"/>
<text x="78" y="385" class="tick" text-anchor="end">0</text>
<text x="78" y="337" class="tick" text-anchor="end">3000</text>
<text x="78" y="289" class="tick" text-anchor="end">6000</text>
<polyline points="110,376 410,372 510,371 610,359 710,332 810,290" fill="none" stroke="#0f9f6e" stroke-width="3"/>
<circle cx="110" cy="376" r="4" fill="#0f9f6e"/><circle cx="410" cy="372" r="4" fill="#0f9f6e"/><circle cx="510" cy="371" r="4" fill="#0f9f6e"/><circle cx="610" cy="359" r="4" fill="#0f9f6e"/><circle cx="710" cy="332" r="4" fill="#0f9f6e"/><circle cx="810" cy="290" r="4" fill="#0f9f6e"/>
<text x="660" y="370" class="small" fill="#b45309">p95 开始陡增</text>

<line x1="610" y1="95" x2="610" y2="393" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="550" y="72" width="120" height="22" rx="4" fill="#fffbeb" stroke="#fde68a"/>
<text x="610" y="87" class="small" text-anchor="middle">拐点附近</text>
<rect x="620" y="225" width="205" height="52" rx="7" fill="#fff7ed" stroke="#fed7aa"/>
<text x="722" y="245" class="small" text-anchor="middle">拐点之后：多出来的并发</text>
<text x="722" y="263" class="small" text-anchor="middle">主要变成排队，不增加吞吐</text>

<line x1="90" y1="400" x2="840" y2="400" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a)"/>
<text x="465" y="421" class="note" text-anchor="middle">并发（1、8、16、32、64、128；1→8 压缩显示）· 算例数据，不是实测</text>
</svg>
