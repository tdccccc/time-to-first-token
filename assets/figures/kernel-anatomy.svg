<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="kernel 时间账与三种瓶颈的判断流程">
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.title{font-size:25px;font-weight:700;fill:#1f2937}
.sub{font-size:15px;fill:#64748b}
.label{font-size:18px;font-weight:600;fill:#1f2937}
.small{font-size:14px;fill:#64748b}
.note{font-size:13px;fill:#64748b}
.hint{font-size:13px;fill:#3f51b5}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="900" height="430" fill="#fbfcfe"/>
<text x="40" y="40" class="title">一个 kernel 慢：先看它在等什么</text>
<text x="40" y="64" class="sub">分别估计计算、数据搬运与固定开销；再用时间线判断实际瓶颈。</text>

<g>
<rect x="40" y="92" width="250" height="150" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="60" y="122" class="label">计算下界</text>
<text x="60" y="146" class="small">FLOPs ÷ 峰值算力</text>
<text x="60" y="172" class="small">典型：大矩阵乘、长 prompt</text>
<text x="60" y="194" class="small">判断：算术强度 &gt; 脊点</text>
<text x="60" y="220" class="hint">动作：更好 tiling、低精度、少算</text>
</g>

<g>
<rect x="325" y="92" width="250" height="150" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
<text x="345" y="122" class="label">数据搬运下界</text>
<text x="345" y="146" class="small">实际字节 ÷ 峰值带宽</text>
<text x="345" y="172" class="small">典型：decode 读权重、逐元素链</text>
<text x="345" y="194" class="small">判断：算术强度 &lt; 脊点</text>
<text x="345" y="220" class="hint">动作：量化、融合、复用、少读写</text>
</g>

<g>
<rect x="610" y="92" width="250" height="150" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="630" y="122" class="label">启动与同步</text>
<text x="630" y="146" class="small">launch + sync + 调度</text>
<text x="630" y="172" class="small">典型：小 kernel、采样、逐元素</text>
<text x="630" y="194" class="small">判断：输入放大后时间基本不变</text>
<text x="630" y="220" class="hint">动作：融合、CUDA Graph、合并启动</text>
</g>

<rect x="40" y="262" width="820" height="52" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="284" class="label">执行时间 ≥ max（计算下界，搬运下界）</text>
<text x="60" y="304" class="small">重叠可减少串行叠加；启动、同步与依赖另计，不能突破上述下界。</text>

<line x1="450" y1="318" x2="450" y2="338" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="344" width="400" height="38" rx="8" fill="#e0e7ff" stroke="#c7d2fe"/>
<text x="450" y="368" class="small" text-anchor="middle" style="font-weight:600;fill:#1f2937">先列假设，再用时间线与计数器验证</text>
<text x="40" y="410" class="note">示意：小 kernel 的启动开销可能比计算和搬运都大；大 decode 通常由带宽决定。</text>
</svg>
